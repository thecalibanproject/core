name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the stable channel; install it explicitly.
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      # rustfmt.toml: max_width 120. Run `cargo fmt --all` before pushing.
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Default features: no ONNX Runtime. Postgres, Valkey, Qdrant and MongoDB tests return early
      # without CALIBAN_TEST_DATABASE_URL / CALIBAN_TEST_VALKEY_URL / CALIBAN_TEST_QDRANT_URL /
      # CALIBAN_MONGO_TEST_URI; the NER test needs `--features ner`.
      - run: cargo test --workspace

  postgres:
    name: Postgres store parity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: caliban
          POSTGRES_PASSWORD: caliban
          POSTGRES_DB: caliban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caliban -d caliban_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CALIBAN_TEST_DATABASE_URL: postgres://caliban:caliban@localhost:5432/caliban_test
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p caliban-cp store::tests::postgres

  valkey:
    name: Valkey quota store
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CALIBAN_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # The memory store's suite against Valkey, plus concurrency across two store instances,
      # reserve/settle, TTL expiry, outage fallback and recovery, and a latency printout; the same
      # for the Idempotency-Key store.
      - run: 'cargo test -p caliban-meter -- --nocapture quota:: idempotency::'

  qdrant:
    name: Qdrant semantic cache store
    runs-on: ubuntu-latest
    services:
      qdrant:
        # Same image as the deploy compose file.
        image: qdrant/qdrant:v1.19.1-unprivileged
        env:
          QDRANT__TELEMETRY_DISABLED: "true"
        ports:
          - 6333:6333
    env:
      CALIBAN_TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # The image has no curl or wget, so wait for the REST port from the runner.
      - run: for i in $(seq 1 30); do curl -sf http://localhost:6333/readyz && exit 0; sleep 2; done; exit 1
      - run: cargo test -p caliban-cache --test qdrant -- --nocapture
      - run: cargo test -p caliban-gateway semantic_miss_latency_against_qdrant -- --nocapture

  ner:
    name: Build with NER (ONNX Runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # ort downloads a prebuilt ONNX Runtime at build time.
      - run: cargo build -p caliban --features ner
