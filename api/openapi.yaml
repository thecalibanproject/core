openapi: 3.1.0
info:
  title: Caliban API
  version: 0.1.0
  description: |
    Two surfaces:
    - **Data plane** (port 8080): OpenAI-compatible inference API with Caliban extensions.
    - **Control plane** (port 8081): admin API used by the web console and SDKs.
    This file is the contract for `web/`, `sdk-typescript/` and `sdk-python/`.

    **Deletes (control plane).** A successful `DELETE` returns `204` with no body and writes one
    hash-chained audit row. `404` (standard error envelope, `error.type` = `not_found`) means the
    id is unknown, belongs to another tenant, or was already deleted: repeat deletes are always
    `404`, never a second `204`, and write no audit row. Tenants, API keys, datasources and nodes
    are soft-deleted (rows kept for audit, never returned again by default); secrets they held
    are destroyed.

    **Admin authentication (control plane).** One of: a console session (cookie from `/auth/callback`;
    writes also send `X-CSRF-Token`), an OIDC access token from the configured issuer
    (`Authorization: Bearer <JWT>`, when `api_audience` is configured), or the break-glass bootstrap
    token (`Authorization: Bearer $CALIBAN_ADMIN_TOKEN`, owner rights, audited). Every admin route
    checks one permission (see `core/docs/sso.md` for the route table): `401` means not
    authenticated, `403` (`error.type` = `permission_error`) means the caller's roles do not allow it.
    List endpoints return only the tenants the caller may see.
servers:
  - url: http://localhost:8080
    description: Data plane
  - url: http://localhost:8081
    description: Control plane

tags:
  - name: inference
  - name: tenants
  - name: provider-keys
  - name: models
  - name: datasources
  - name: ontology
  - name: nodes
  - name: tools
  - name: evals
  - name: usage
  - name: system
  - name: auth

security:
  - bearer: []

paths:
  # ───────────────────────────── Data plane ─────────────────────────────
  /v1/chat/completions:
    post:
      tags: [inference]
      summary: OpenAI-compatible chat completion (streaming via SSE when stream=true)
      description: |
        Authenticate with a tenant API key (`cal_…`).

        **Nodes.** `model: "node/<name>"` (or `"node/<name>@v<N>"`) runs a published node: the
        messages become its input, its output is the assistant message, and a human step is the
        assistant message with `finish_reason: "input_required"` (continue with the header
        `Caliban-Run-Id` and the answer as the last user message). The body then carries a `caliban`
        object (`run_id`, `status`, `node`, `version`, `cost_usd`, `awaiting`). With
        `model: "caliban/auto"`, a tenant that maps intents to nodes gets the node when the request
        classifies into such an intent (see core/docs/nodes.md).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: Completion, or an SSE stream of `chat.completion.chunk` objects.
          headers:
            x-caliban-request-id: { schema: { type: string } }
            x-caliban-routed-model: { schema: { type: string } }
            x-caliban-intent: { schema: { type: string }, description: 'Routing decision: `<intent>;confidence=<0..1>;stage=<rules|knn|keyword>`, plus `;knn=<reason>` (timeout, embed_error, unavailable, no_text, abstain_oos, abstain_confidence, abstain_margin, abstain_empty) when kNN was on but did not decide. The intent is `pinned` for a named model.' }
            x-caliban-cache: { schema: { type: string, enum: [hit, miss, bypass] }, description: '`hit` for both cache tiers (see `x-caliban-cache-tier`); `miss` when a cache applied but had no answer; `bypass` when no cache applies to the request.' }
            x-caliban-cache-tier: { schema: { type: string, enum: [exact, semantic] }, description: 'Only on hits. `exact`: byte-identical (pseudonymised) request. `semantic`: an earlier, semantically similar request of the same tenant with the same model, system prompt, history and parameters.' }
            x-caliban-pii-entities: { schema: { type: integer } }
            x-caliban-cost-usd: { schema: { type: string }, description: 'Cost of this request in USD (non-streaming only; absent when the model has no price).' }
            x-caliban-route: { schema: { type: string }, description: 'The path taken: `node/<name>@v<N>` (a node answered), or `model:<id>` (a `caliban/auto` answer by a model, for a tenant that maps intents to nodes).' }
            x-caliban-route-fallback: { schema: { type: string, enum: [low_confidence, no_node_for_intent, node_not_allowed, node_unavailable, nodes_not_enabled, node_over_budget, node_input_invalid] }, description: 'Why `caliban/auto` answered with a model rather than a node.' }
            Caliban-Run-Id: { schema: { type: string }, description: 'The node run that answered.' }
            x-caliban-run-status: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletionResponse' }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Overloaded' }
  /v1/messages:
    post:
      tags: [inference]
      summary: Anthropic Messages API (streaming via SSE when stream=true)
      description: |
        Same pipeline as `/v1/chat/completions` (auth, rate limits, PII protect/rehydrate, routing,
        cache, fallbacks, metering). Authenticate with `x-api-key: cal_…` (Anthropic SDKs) or a
        bearer key. When the routed model's provider is Anthropic the request body is passed
        through natively (`cache_control` breakpoints preserved, PII applied to text blocks);
        otherwise it is translated to the model's dialect and the response translated back,
        including stream events (`message_start`, `content_block_start/delta/stop` with
        `text`/`thinking`/`tool_use`, `message_delta`, `message_stop`, `ping`). `thinking` maps to
        the Caliban reasoning preference; the optional `caliban` extension is accepted. Errors use
        the Anthropic shape (`AnthropicError`).
      security:
        - apiKey: []
        - bearer: []
      parameters:
        - { name: anthropic-version, in: header, required: false, schema: { type: string, example: '2023-06-01' } }
        - { name: anthropic-beta, in: header, required: false, schema: { type: string }, description: 'Forwarded to Anthropic on native passthrough.' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessagesRequest' }
      responses:
        '200':
          description: An Anthropic `message`, or an SSE stream of Anthropic events.
          headers:
            request-id: { schema: { type: string } }
            x-caliban-request-id: { schema: { type: string } }
            x-caliban-routed-model: { schema: { type: string } }
            x-caliban-intent: { schema: { type: string }, description: 'Routing decision: `<intent>;confidence=<0..1>;stage=<rules|knn|keyword>`, plus `;knn=<reason>` (timeout, embed_error, unavailable, no_text, abstain_oos, abstain_confidence, abstain_margin, abstain_empty) when kNN was on but did not decide. The intent is `pinned` for a named model.' }
            x-caliban-cache: { schema: { type: string, enum: [hit, miss, bypass] }, description: '`hit` for both cache tiers (see `x-caliban-cache-tier`); `miss` when a cache applied but had no answer; `bypass` when no cache applies to the request.' }
            x-caliban-cache-tier: { schema: { type: string, enum: [exact, semantic] }, description: 'Only on hits. `exact`: byte-identical (pseudonymised) request. `semantic`: an earlier, semantically similar request of the same tenant with the same model, system prompt, history and parameters.' }
            x-caliban-pii-entities: { schema: { type: integer } }
            x-caliban-cost-usd: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicMessage' }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/AnthropicError' }
        '401': { $ref: '#/components/responses/AnthropicError' }
        '403': { $ref: '#/components/responses/AnthropicError' }
        '429': { $ref: '#/components/responses/AnthropicRateLimited' }
        '502': { $ref: '#/components/responses/AnthropicError' }
        '503': { $ref: '#/components/responses/AnthropicOverloaded' }
  /v1/messages/count_tokens:
    post:
      tags: [inference]
      summary: Approximate input token count for an Anthropic Messages request
      description: Estimate without a tokenizer (~4 bytes per token plus message, image and tool overhead); the same estimate quota reservations use.
      security:
        - apiKey: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessagesRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [input_tokens]
                properties:
                  input_tokens: { type: integer }
        '400': { $ref: '#/components/responses/AnthropicError' }
        '401': { $ref: '#/components/responses/AnthropicError' }
  /v1/models:
    get:
      tags: [inference]
      summary: Models available to the calling tenant (OpenAI format)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, owned_by]
                      properties:
                        id: { type: string }
                        object: { type: string, const: model }
                        owned_by: { type: string }
                        caliban:
                          type: object
                          description: Absent on caliban/auto.
                          required: [kind, capabilities, trust_tier]
                          properties:
                            kind: { $ref: '#/components/schemas/ModelKind' }
                            family: { type: [string, 'null'] }
                            capabilities: { $ref: '#/components/schemas/ModelCapabilities' }
                            trust_tier: { $ref: '#/components/schemas/TrustTier' }

  /v1/embeddings:
    post:
      tags: [inference]
      summary: OpenAI-compatible embeddings (open embedding models on-prem, or BYOK providers)
      description: Inputs sent outside the trust boundary are PII-masked (vectors cannot be rehydrated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              additionalProperties: true
              properties:
                model: { type: string }
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
      responses:
        '200':
          description: OK
          headers:
            x-caliban-request-id: { schema: { type: string } }
            x-caliban-routed-model: { schema: { type: string } }
            x-caliban-pii-entities: { schema: { type: integer }, description: 'Entities masked before an external provider' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  object: { type: string }
                  model: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        embedding: { type: array, items: { type: number } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/rerank:
    post:
      tags: [inference]
      summary: Rerank documents against a query (Cohere/Jina-style; e.g. Qwen3-Reranker on vLLM, bge-reranker on TEI)
      description: Text sent outside the trust boundary is PII-masked; returned documents are always the caller's originals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, query, documents]
              properties:
                model: { type: string }
                query: { type: string }
                documents: { type: array, items: { type: string }, minItems: 1 }
                top_n: { type: integer, minimum: 1 }
                return_documents: { type: boolean, default: false }
      responses:
        '200':
          description: Results sorted by relevance_score, descending
          headers:
            x-caliban-request-id: { schema: { type: string } }
            x-caliban-routed-model: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [model, results]
                properties:
                  model: { type: string }
                  results:
                    type: array
                    items:
                      type: object
                      required: [index, relevance_score]
                      properties:
                        index: { type: integer }
                        relevance_score: { type: number }
                        document:
                          type: object
                          properties:
                            text: { type: string }
                  usage:
                    type: object
                    properties:
                      total_tokens: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/nodes/{nodeName}/runs:
    parameters: [ { $ref: '#/components/parameters/NodeName' } ]
    post:
      tags: [nodes]
      summary: Run a published node
      description: |
        Starts a run of the node's live version (or `version`). The API key must be allowed to run
        the node (its node allowlist; no allowlist: every published node of the tenant). The input
        is checked against the node's `prompt.input_schema`.

        **Sync** (default): waits until the run ends or waits for a human, at most the server's
        `CALIBAN_NODE_SYNC_WAIT_SECS` (default 60) or `wait_s`; `200` when the run ended, `202`
        with the run so far otherwise. **Async** (`"async": true`): `202` at once; poll
        `GET /v1/runs/{id}` (also in `Location`).

        `Idempotency-Key` (1 to 255 visible ASCII characters, per tenant, kept with the run):
        a repeat returns the run the first request created (`Idempotent-Replayed: true`) and starts
        nothing; the same key with another body is a `422` (`idempotency_key_reused`).

        **Stream** (`"stream": true`): `200` with the run's events (`text/event-stream`, see
        `GET /v1/runs/{runId}/events`) until it ends or waits for a human.

        Instead of `input`, `chat.messages` gives chat messages, mapped to the node's input as the
        `node/<name>` chat shortcut does.

        **Untrusted caller data** (`untrusted`): `true` marks the whole input, a list of JSON
        pointers marks fields (`["/email/body"]`). Marked values that are present (and the fields
        the node's input schema declares `x-caliban-untrusted: true`, whoever calls) make the run
        input carry the `caller` taint label: a write tool their data reaches needs an
        `allow_tainted` entry or a human approval, as with tool outputs. Unmarked input is trusted
        (the API key that may run the node is the principal). See core/docs/tools.md.

        Every model call the run makes goes through the gateway pipeline as the invoking key (PII,
        caches, routing, quotas, metering), with an Idempotency-Key per step. Split-mode routers
        forward this request to a worker.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                input: { description: 'Any JSON value: the run input' }
                chat:
                  type: object
                  required: [messages]
                  additionalProperties: false
                  description: 'Chat messages instead of `input` (mapped to the node''s input).'
                  properties:
                    messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
                version: { type: integer, minimum: 1, description: 'A published version; default: the live one' }
                async: { type: boolean, default: false }
                stream: { type: boolean, default: false, description: 'Answer with the run''s events (SSE)' }
                wait_s: { type: number, minimum: 0, description: 'Sync runs: wait at most this long (capped by the server)' }
                budget:
                  type: object
                  additionalProperties: false
                  description: Lowers the version's budget for this run (a larger value is ignored).
                  properties:
                    steps: { type: integer, minimum: 1 }
                    tokens: { type: integer, minimum: 1 }
                    usd: { type: number, exclusiveMinimum: 0 }
                    wall_clock_s: { type: integer, minimum: 1 }
                untrusted:
                  description: 'Input the caller marks as untrusted data (taint label `caller`): `true` (all of it), `false`, or JSON pointers into the input (`""` is the whole input)'
                  oneOf:
                    - type: boolean
                    - type: array
                      maxItems: 64
                      items: { type: string, pattern: '^(/.*)?$' }
      responses:
        '200':
          description: The run ended (succeeded, failed, budget_exhausted or cancelled), or its event stream
          headers:
            Caliban-Run-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeRun' }
            text/event-stream:
              schema: { type: string, description: 'Run events (`stream: true`), see `RunEvent`' }
        '202':
          description: The run is pending, running, sleeping or waiting for input
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeRun' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/runs:
    get:
      tags: [nodes]
      summary: List node runs
      description: |
        Runs of the key's tenant, of the nodes the key may run (its allowlist), newest first.
        Summaries only (no content, no steps). Page with `cursor` (`next_cursor` of the previous page;
        `null` on the last).
      parameters:
        - { name: node, in: query, schema: { type: string } }
        - { name: version, in: query, schema: { type: integer, minimum: 1 }, description: 'Only runs of this version (with `node`: that node''s version)' }
        - { name: status, in: query, schema: { type: string }, description: 'Comma-separated run statuses' }
        - { name: created_after, in: query, schema: { type: string, format: date-time } }
        - { name: created_before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeRunList' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/runs/{runId}/events:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      tags: [nodes]
      summary: Follow a run's events (SSE)
      description: |
        The run's events from the journal, numbered from 1, so a client resumes on any worker or
        router with `Last-Event-ID` (or `?after=`). Each SSE event has `id`, `event` (the type) and
        `data` (a `RunEvent`). The stream ends after `run.finished`, or after `run.input_required`
        while the run waits for that answer; that last event carries the run in `run`. Events never
        carry step content; `run.input_required` carries the question.
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: The event stream
          content:
            text/event-stream:
              schema: { type: string, description: 'Server-Sent Events; each `data` is a `RunEvent`' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/runs/{runId}/cancel:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    post:
      tags: [nodes]
      summary: Cancel a node run
      description: |
        Durable: a run that waits (pending, sleeping, input required) is `cancelled` at once (`200`);
        a running run is asked to stop (`202`, `cancel_requested: true`) and stops at its next step
        boundary on whichever worker runs it (the model call in flight completes and is recorded; a
        failing one is not retried). Cancelling a cancelled run is `200`; a run that ended otherwise
        is `409` (`run_already_ended`). Audited as `node.run.cancel`.
      responses:
        '200':
          description: The run is cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeRun' }
        '202':
          description: The running run will stop at its next step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeRun' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /mcp:
    post:
      tags: [nodes]
      summary: The MCP server (Streamable HTTP, stateless)
      description: |
        JSON-RPC over Streamable HTTP. Authenticate with the tenant API key as bearer token (`401`
        otherwise). `tools/list`: the published nodes the key may run (input schema: the node's).
        `tools/call`: runs the node, waits at most `CALIBAN_NODE_SYNC_WAIT_SECS`. With
        `CALIBAN_MCP_TASKS=true`, clients declaring the tasks extension get a task (its id is the run
        id) and use `tasks/get`, `tasks/update`, `tasks/cancel`. `params._meta["caliban/untrusted"]`
        on `tools/call` (`true`, or JSON pointers into the arguments) marks arguments as untrusted
        caller data, like `untrusted` on `POST /v1/nodes/{name}/runs`. See core/docs/nodes.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: 'A JSON-RPC message' }
      responses:
        '200':
          description: The JSON-RPC answer
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Error' }

  /v1/runs/{runId}:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      tags: [nodes]
      summary: Get a node run
      description: A run of the key's tenant, of a node the key may run.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeRun' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/runs/{runId}/input:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    post:
      tags: [nodes]
      summary: Answer the human step a run waits for
      description: |
        Records the answer (sealed in the journal, with who answered: `api_key:<hash prefix>`) and
        resumes the run. `step` defaults to the step the run waits for (`awaiting.step`). `409`
        (`run_not_awaiting_input`) when the run is not waiting for input, or not for that step.

        A step named `<step>@approve` is the approval of a write whose arguments carry untrusted taint
        labels: answer `{"approve": true}` or `{"approve": false}` (a refusal fails the call). The
        decision is journaled as an `approval` step (see docs/tools.md). Answers and approval decisions
        are audited (`node.run.answer`, `node.write.approve`, `node.write.deny`) in the control
        plane's hash-chained log, with who answered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              additionalProperties: false
              properties:
                answer: { description: 'Any JSON value' }
                step: { type: string }
      responses:
        '202':
          description: Accepted; the run resumes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeRun' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # ──────────────────────────── Control plane ───────────────────────────
  /api/v1/health:
    get:
      tags: [system]
      security: []
      summary: Liveness and build info
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/v1/tenants:
    get:
      tags: [tenants]
      summary: List tenants
      description: Active tenants. Deleted tenants (tombstones) are included only with `include_deleted=true`.
      parameters:
        - name: include_deleted
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
    post:
      tags: [tenants]
      summary: Create a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }

  /api/v1/tenants/{tenantId}:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [tenants]
      summary: Get a tenant
      description: A deleted tenant is a 404.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [tenants]
      summary: Change a tenant's PII, cache and cache-hit billing settings
      description: |
        Absent fields keep their value; other fields are rejected. Audited as `tenant.update`
        (old and new values). Routers apply the change with their next snapshot.
        `pii_surrogate_scope: session` opts the tenant out of per-tenant surrogates: every request
        gets fresh surrogates (unlinkable), and requests carrying PII bypass the exact and semantic
        caches. `semantic_cache: on` lets the tenant's eligible requests use the semantic cache
        (also needs `[cache.semantic] enabled`). `auto_cache_hit_fraction` sets the share of the
        flat `caliban/auto` price billed for this tenant's cache hits (0 to 1); `null` clears it, so
        the deployment's `[routing] auto_cache_hit_fraction` (default 0.2) applies. Out of range
        is a 422. `node_caps` bounds the budgets of every node version the tenant publishes (and
        promotes); `null` restores the defaults. Lowering the caps does not touch versions already
        published, but promoting one that no longer fits is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [tenants]
      summary: Delete a tenant (tombstone)
      description: |
        In one audited transaction (`tenant.delete`): the tenant becomes a tombstone
        (`status: deleted`, `deleted_at` set), all its API keys are revoked, its BYOK provider
        credentials and its data key (DEK) are destroyed (crypto-shredding), its routes are removed, and its
        datasources (connection settings wiped) and nodes are soft-deleted. The tenant leaves the
        data-plane snapshot, so routers reject its keys from their next snapshot. Audit rows are
        kept. The tenant id cannot be reused (`POST /api/v1/tenants` with the same name is a 409).
        Every tenant-scoped endpoint returns 404 for a deleted tenant.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/api-keys:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [tenants]
      summary: List the tenant's Caliban API keys (metadata only)
      description: Active keys. Revoked keys (with `revoked_at`) are included only with `include_revoked=true`.
      parameters:
        - name: include_revoked
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ApiKeyInfo' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [tenants]
      summary: Mint a Caliban API key. The plaintext is returned exactly once.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                nodes:
                  type: array
                  items: { type: string }
                  description: |
                    Node allowlist: the nodes this key may run (`POST /v1/nodes/{name}/runs`). Absent:
                    every published node of the tenant. `[]`: none. Granting node access needs the
                    `nodes.run` permission on the tenant (`403` otherwise); a creator without it gets
                    a key that runs no nodes.
                datasource_scopes:
                  type: array
                  items: { type: string }
                  description: |
                    Datasource scopes (`<datasource>.<object>:read`) the built-in datasource query tool
                    may read for this key's runs, intersected with each node's `datasources.scopes`.
                    Absent: every scope of the nodes it runs.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/api-keys/{keyId}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - name: keyId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [tenants]
      summary: Revoke a Caliban API key
      description: |
        Soft revoke (`api_key.revoke` audit row): the key keeps its row with `revoked_at` set and
        its hash leaves the data-plane snapshot. A standalone deployment rejects the key (401) on
        the next request; a split-mode router rejects it after its next snapshot poll
        (`CALIBAN_SNAPSHOT_POLL_SECS`, default 10 s). A revoked key's hash can never be reused.
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'The tenant''s eval key: managed by the control plane (rotate it with `POST .../eval-key/rotate`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [tenants]
      summary: Change an API key's node allowlist and datasource scopes
      description: |
        Absent fields are kept; `null` lifts a restriction (every published node; every scope of the
        nodes it runs). Changing node access needs `nodes.run` on the tenant (`403` otherwise).
        Audited as `api_key.update` with the old and new values; routers apply it with their next
        snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nodes: { type: [array, 'null'], items: { type: string } }
                datasource_scopes: { type: [array, 'null'], items: { type: string } }
      responses:
        '200':
          description: The key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyInfo' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/runs:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [nodes]
      summary: The tenant's node runs (console)
      description: |
        Newest first, from the node journal (the database's, or a standalone process's in-memory
        one; `503` when the control plane has none). Permission `runs.read`.
      parameters:
        - { name: node, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: 'Comma-separated run statuses' }
        - { name: created_after, in: query, schema: { type: string, format: date-time } }
        - { name: created_before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeRunList' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/runs/{runId}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      tags: [nodes]
      summary: A node run (console)
      description: |
        Metadata with `runs.read`: status, budget, cost, usage, steps (vertex, kind, status, timings,
        tokens, cost, taint labels). With `runs.data` also the content (`input`, `output`, each
        step's `output`, the awaited `question`); `content_visible` says which.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleRun' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/runs/{runId}/input:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: runId, in: path, required: true, schema: { type: string } }
    post:
      tags: [nodes]
      summary: Answer a question or approve or deny a tainted write (console)
      description: |
        As the signed-in user (permission `runs.answer`): journaled with the user's identity and
        recorded in the audit chain (`node.run.answer`, `node.write.approve`, `node.write.deny`). An
        approval takes `{"approve": true}` or `{"approve": false}`. `409` when the run is not waiting
        (or not for `step`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              additionalProperties: false
              properties:
                answer: { description: 'Any JSON value' }
                step: { type: string }
      responses:
        '202':
          description: Accepted; a worker resumes the run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleRun' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/runs/{runId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: runId, in: path, required: true, schema: { type: string } }
    post:
      tags: [nodes]
      summary: Cancel a run (console)
      description: |
        As the signed-in user (permission `runs.answer`: whoever may deny a write, which fails the
        run, may stop it). Audited once as `node.run.cancel`. A waiting run (pending, sleeping,
        input required) ends at once (`200`); a running run is asked to stop and its worker stops
        at the next step boundary (`202`); a run already cancelled is a `200`; a run that ended
        otherwise is a `409` (`run_already_ended`).
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleRun' }
        '202':
          description: Asked to stop
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleRun' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/inbox:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [nodes]
      summary: Runs waiting for a human (console)
      description: |
        Questions and approvals of tainted writes, oldest wait first (permission `runs.read`; the
        question with `runs.data`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [object, data, content_visible]
                properties:
                  object: { type: string, enum: [list] }
                  content_visible: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      required: [run_id, node, version, step, kind, waiting_since]
                      properties:
                        run_id: { type: string }
                        node: { type: string }
                        version: { type: integer }
                        step: { type: string }
                        kind: { type: string, enum: [question, approval] }
                        question: { type: [string, 'null'] }
                        invoker: { type: string }
                        waiting_since: { type: string, format: date-time }
                        expires_at: { type: [string, 'null'], format: date-time, description: 'When the human step times out (its `timeout_s`)' }
                        approval:
                          type: [object, 'null']
                          description: '`kind: approval` only: what the gated call would do, structured (the `question` text says the same). `arguments` with `runs.data` only. Null for runs from a worker that recorded none.'
                          properties:
                            tool: { type: string, description: 'The tool reference (`mcp://server/tool#sha256:...`)' }
                            effect: { type: string, description: '`write`, or `read, reaches the network through its arguments`' }
                            labels: { type: array, items: { type: string }, description: 'The untrusted taint labels its arguments carry' }
                            arguments: { description: 'With `runs.data`: the arguments it would be called with' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/node-spend:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [usage]
      summary: The tenant's node spend today and this month, against its caps
      description: |
        What the tenant's node runs spent on model calls (USD, priced like the metering) today and
        this month (UTC), across every worker, from the node journal (`503` without one), next to
        its `node_spend_caps`. Permission `usage.read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, day, month, today_usd, month_usd, caps, remaining, capped]
                properties:
                  tenant_id: { type: string }
                  day: { type: string, description: 'YYYY-MM-DD (UTC)' }
                  month: { type: string, description: 'YYYY-MM (UTC)' }
                  today_usd: { type: number }
                  month_usd: { type: number }
                  caps:
                    type: object
                    properties:
                      daily_usd: { type: [number, 'null'] }
                      monthly_usd: { type: [number, 'null'] }
                  remaining:
                    type: object
                    properties:
                      daily_usd: { type: [number, 'null'], description: '`null`: no cap' }
                      monthly_usd: { type: [number, 'null'] }
                  capped: { type: boolean, description: 'A cap is reached: runs stop at their next model call' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/datasources/{datasourceId}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - name: datasourceId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [datasources]
      summary: Delete a datasource
      description: |
        Soft delete (`datasource.delete` audit row), scoped to the tenant in the path: the row is
        kept with its stored connection settings wiped, it is no longer listed or introspectable,
        and its name can be used again.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/nodes/{nodeId}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - name: nodeId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [nodes]
      summary: Delete a node version
      description: |
        Soft-deletes one node version by its record id (`node.delete` audit row), scoped to the
        tenant in the path. Drafts and retired versions can be deleted; a published version is a
        409 (retire it first). It is no longer listed; its version number is not reused.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/nodes/{nodeName}/versions:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/NodeName' }
    get:
      tags: [nodes]
      summary: List the versions of a node
      description: Every version not deleted (drafts, published and retired), oldest first, and the live one. Needs `nodes.read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  live: { type: [integer, 'null'], description: 'The promoted version; `null` when none is.' }
                  promotion:
                    type: [object, 'null']
                    properties:
                      version: { type: integer }
                      promoted_at: { type: string, format: date-time }
                      promoted_by: { type: string }
                  versions: { type: array, items: { $ref: '#/components/schemas/Node' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [nodes]
      summary: Create a draft version
      description: |
        The version number is the node's latest plus one. The spec is checked statically
        (schemas/node.schema.json; MCP tools pinned; cycles bounded by `max_iterations`; `code`
        vertices are refused as not yet supported) and content-hashed. Versions are immutable:
        changing a node means creating a new version. Needs `nodes.write`; audited as `node.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/nodes/{nodeName}/versions/{version}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/NodeName' }
      - { $ref: '#/components/parameters/NodeVersion' }
    get:
      tags: [nodes]
      summary: Get a version (spec and content hash)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/nodes/{nodeName}/versions/{version}/publish:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/NodeName' }
      - { $ref: '#/components/parameters/NodeVersion' }
    post:
      tags: [nodes]
      summary: Publish a draft (and promote it by default)
      description: |
        Validates the draft against the tenant: the static checks again; every `node://name@vN` it
        calls is a published version of the same tenant and references form no cycle; every
        datasource scope (`<datasource>.<object>:<access>`) names a datasource of the tenant and
        `*` or an approved ontology entity bound to it; the budgets fit the tenant's
        `node_caps`; `mcp://` tools are pinned (resolving them against an approved tool registry
        comes with the MCP client). The spec is then sealed under the tenant's data key (created on
        first use; needs `CALIBAN_KEK`, else 400) and ships to routers and workers in the signed
        snapshot. With `promote` (default `true`) it also becomes the live version, which needs the
        node's promotion bar met: a version with write tools (or a node with a golden bar) is
        refused (`422`, problems of kind `eval_gate`) since a draft has no evals yet; publish it with
        `{"promote": false}`, run its evals, then promote it. Needs `nodes.publish`; audited as
        `node.publish` (with the evals that met the bar, under `evals`). A version that is not a
        draft is a 409; a validation failure is a 422 listing every problem.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                promote: { type: boolean, default: true }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/nodes/{nodeName}/versions/{version}/retire:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/NodeName' }
      - { $ref: '#/components/parameters/NodeVersion' }
    post:
      tags: [nodes]
      summary: Retire a published version
      description: |
        The version leaves the data-plane snapshot: new runs of it are refused (`404`), and runs
        already started finish on the version they started on (each run keeps the specs of the
        versions it can reach, sealed in the journal). If it was live, the node has no live version
        until another is promoted. A version still called (`node://`) by another published version is a 409.
        Retirement is final. Needs `nodes.publish`; audited as `node.retire`.
      responses:
        '200':
          description: Retired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/nodes/{nodeName}/promote:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/NodeName' }
    post:
      tags: [nodes]
      summary: Move the promotion pointer (promote or roll back)
      description: |
        Makes a published version the live one (what `POST /v1/nodes/{name}/runs` without a version
        runs). Its budgets are checked against the tenant's current `node_caps` (422). The node's
        promotion bar must be met by the version's latest finished evals (422, problems of kind
        `eval_gate`): the golden bar when the node sets one, and for a version with write tools
        always an injection eval (default bar: every attack blocked). Every `node://` subnode version
        it pins (down the tree) must pass its own gate too (problem `path`: `node://<child>@v<N>`;
        evidence under `subnodes`). A draft or a retired version is a 409. Needs `nodes.publish`; audited as `node.promote` with the previous live version
        and the evals that met the bar (`evals`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: Promoted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/nodes/{nodeName}/diff:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/NodeName' }
    get:
      tags: [nodes]
      summary: Diff two versions
      description: Their hashes and a structural JSON diff of their specs (JSON pointers; arrays compared index by index).
      parameters:
        - { name: from, in: query, required: true, schema: { type: integer } }
        - { name: to, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  from: { type: object, properties: { version: { type: integer }, hash: { type: string }, state: { type: string } } }
                  to: { type: object, properties: { version: { type: integer }, hash: { type: string }, state: { type: string } } }
                  identical: { type: boolean }
                  changes:
                    type: array
                    items:
                      type: object
                      required: [path, op]
                      properties:
                        path: { type: string, description: 'JSON pointer' }
                        op: { type: string, enum: [added, removed, changed] }
                        from: {}
                        to: {}
        '404': { $ref: '#/components/responses/Error' }

  # ───────────────────────────── Evals ─────────────────────────────
  /api/v1/tenants/{tenantId}/nodes/{nodeName}/versions/{version}/golden-set:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/NodeName' }
      - { $ref: '#/components/parameters/NodeVersion' }
    get:
      tags: [evals]
      summary: The golden set of a version
      description: Metadata with `nodes.read`; the cases (tenant content, sealed at rest) also with `runs.data`. 503 without a node journal.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GoldenSet' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [evals]
      summary: Create or replace the golden set of a version
      description: |
        At most 200 cases, unique ids, at least one check each; inputs are checked against the
        version's `prompt.input_schema` (422 listing every problem, kind `golden_set`). Sealed under
        the tenant's data key. Needs `nodes.write`; audited as `node.golden_set.update` (counts and
        hashes, never cases).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cases]
              properties:
                cases: { type: array, items: { $ref: '#/components/schemas/GoldenCase' } }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/GoldenSet' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [evals]
      summary: Delete the golden set of a version
      description: Needs `nodes.write`; audited as `node.golden_set.delete`.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/nodes/{nodeName}/eval-policy:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/NodeName' }
    get:
      tags: [evals]
      summary: The node's promotion bar
      description: '`nodes.read`. `injection_bar` is the bar in effect for versions with write tools.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalPolicyView' }
    put:
      tags: [evals]
      summary: Set the node's promotion bar
      description: Needs `nodes.publish` (it decides what may be promoted); audited as `node.eval_policy.update` with the old and new bar.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EvalPolicy' } } }
      responses:
        '200':
          description: Stored; the bar now in effect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalPolicyView' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/nodes/{nodeName}/versions/{version}/evals:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/NodeName' }
      - { $ref: '#/components/parameters/NodeVersion' }
    post:
      tags: [evals]
      summary: Start an eval of a published version
      description: |
        `golden`: every case of the version's golden set (or `cases`) runs `k` times (default 3) as
        ordinary node runs on workers, through the request pipeline, as the tenant's eval key (created
        and managed by the control plane, see `GET .../eval-key`), or as the API key `api_key_id`
        when one is named (it must be active and allowed to run the node). The key's quotas apply and
        its usage is metered.
        `injection`: the built-in injection suite against sandboxed tools (`k` default 1); the run
        input is `input`, else the input of `input_case` (or the golden set's first case), whose
        checks then measure utility under attack. Needs `nodes.run`; audited as `node.eval.start`.
        A version that is not published is a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suite]
              properties:
                suite: { type: string, enum: [golden, injection] }
                api_key_id: { type: string, description: 'Optional: a customer API key to run the eval as. Absent: the tenant''s eval key' }
                k: { type: integer, minimum: 1, maximum: 10 }
                concurrency: { type: integer, minimum: 1, maximum: 16, default: 4 }
                cases: { type: array, items: { type: string }, description: 'Golden: only these cases' }
                judge_model: { type: string, description: 'Golden: the default judge model (recorded in the summary)' }
                input: { description: 'Injection: the run input' }
                input_case: { type: string, description: 'Injection: take the input (and its checks) from this golden case' }
      responses:
        '202': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/Eval' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/nodes/{nodeName}/versions/{version}/gate:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/NodeName' }
      - { $ref: '#/components/parameters/NodeVersion' }
    get:
      tags: [evals]
      summary: What promoting the version would say
      description: '`nodes.read`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { type: string }
                  version: { type: integer }
                  has_write_tools: { type: boolean }
                  allowed: { type: boolean }
                  evidence: { oneOf: [ { $ref: '#/components/schemas/GateEvidence' }, { type: 'null' } ], description: 'The evals that meet the bar; null when no gate applies' }
                  problems:
                    type: array
                    description: 'Every reason it cannot be promoted (kind `eval_gate`; `path` names a subnode whose own gate failed)'
                    items: { $ref: '#/components/schemas/Problem' }

  /api/v1/tenants/{tenantId}/eval-key:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [evals]
      summary: The tenant's eval key
      description: |
        `api_keys.read`. The API key the control plane creates and manages for the tenant's evals
        (on the first eval that names no key). Its plaintext never exists outside the moment it is
        generated; the data plane refuses it on its endpoints (`401`); workers use it for eval runs
        and judge calls, which are metered and limited as this key. `key` is null before the first
        eval. Revoked with the tenant.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, key]
                properties:
                  tenant_id: { type: string }
                  key: { oneOf: [ { $ref: '#/components/schemas/ApiKeyInfo' }, { type: 'null' } ] }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/eval-key/rotate:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    post:
      tags: [evals]
      summary: Rotate the tenant's eval key
      description: |
        `api_keys.write`. Revokes the eval key (`api_key.revoke`) and creates a new one
        (`api_key.create`, `purpose: eval`). Evals in flight lose their key: rotate between evals.
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, key, revoked]
                properties:
                  tenant_id: { type: string }
                  key: { $ref: '#/components/schemas/ApiKeyInfo' }
                  revoked: { type: [string, 'null'], description: 'The id of the key it replaced' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/evals:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [evals]
      summary: The tenant's evals, newest first
      description: '`nodes.read`. Metrics included, content never.'
      parameters:
        - { name: node, in: query, schema: { type: string } }
        - { name: version, in: query, schema: { type: integer } }
        - { name: suite, in: query, schema: { type: string, enum: [golden, injection] } }
        - { name: status, in: query, schema: { type: string }, description: 'Comma separated' }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [list] }
                  data: { type: array, items: { $ref: '#/components/schemas/Eval' } }
                  next_cursor: { type: [string, 'null'] }

  /api/v1/tenants/{tenantId}/evals/{evalId}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: evalId, in: path, required: true, schema: { type: string } }
    get:
      tags: [evals]
      summary: An eval and its trials
      description: '`nodes.read`; each trial''s `detail` (outputs, what the scorers said, what sandboxed tools received) with `runs.data`.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Eval' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/evals/{evalId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: evalId, in: path, required: true, schema: { type: string } }
    post:
      tags: [evals]
      summary: Cancel an eval
      description: 'A pending eval ends at once (200); a running one stops, with its runs in flight, at its worker''s next check (202). An eval that ended otherwise is a 409. Needs `nodes.run`; audited as `node.eval.cancel`.'
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Eval' } } } }
        '202': { description: Cancellation asked for, content: { application/json: { schema: { $ref: '#/components/schemas/Eval' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/provider-keys:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [provider-keys]
      summary: List BYOK provider credentials (secrets are never returned)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProviderKey' } }
    post:
      tags: [provider-keys]
      summary: Add a BYOK provider credential or local endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderKeyCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKey' }

  /api/v1/tenants/{tenantId}/provider-keys/{keyId}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - name: keyId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [provider-keys]
      summary: Delete a provider credential (the secret is crypto-shredded)
      responses:
        '204': { description: Deleted }

  /api/v1/models:
    get:
      tags: [models]
      summary: Model catalogue
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Model' } }
    post:
      tags: [models]
      summary: Register a model (e.g. an open model served on-prem; often taken from a discovery suggestion)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/models/{modelId}:
    parameters:
      - name: modelId
        in: path
        required: true
        description: Model id; may contain '/', e.g. local/qwen3-8b (sent unescaped).
        schema: { type: string }
    delete:
      tags: [models]
      summary: Remove a model from the catalogue (409 if a route still uses it)
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/providers:
    get:
      tags: [models]
      summary: Shared model servers (on-prem pools such as vLLM, SGLang, llama.cpp, Ollama)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SharedProvider' } }
    post:
      tags: [models]
      summary: Register a shared model server
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharedProviderCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedProvider' }

  /api/v1/providers/{providerId}:
    parameters: [ { $ref: '#/components/parameters/ProviderId' } ]
    delete:
      tags: [models]
      summary: Remove a shared model server (409 if models still use it)
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/providers/{providerId}/health:
    parameters: [ { $ref: '#/components/parameters/ProviderId' } ]
    get:
      tags: [models]
      summary: Probe the server's /models endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok, unreachable] }
                  latency_ms: { type: integer }
                  models: { type: integer }
                  error: { type: string }

  /api/v1/providers/{providerId}/discover:
    parameters: [ { $ref: '#/components/parameters/ProviderId' } ]
    post:
      tags: [models]
      summary: List models the server serves and suggest catalogue entries for new ones (heuristic; review before saving)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [provider, available, suggested]
                properties:
                  provider: { type: string }
                  available: { type: array, items: { type: string } }
                  suggested: { type: array, items: { $ref: '#/components/schemas/ModelCreate' } }
        '502': { $ref: '#/components/responses/Error' }

  /api/v1/datasources:
    get:
      tags: [datasources]
      summary: List datasources
      parameters: [ { $ref: '#/components/parameters/TenantQuery' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Datasource' } }
    post:
      tags: [datasources]
      summary: Register a datasource (credentials are stored like BYOK secrets)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatasourceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Datasource' }

  /api/v1/datasources/{datasourceId}/introspect:
    parameters:
      - name: datasourceId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [ontology]
      summary: Introspect and profile a source, then propose ontology elements (all with status=proposed)
      responses:
        '202':
          description: Bootstrap job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }

  /api/v1/ontology:
    get:
      tags: [ontology]
      summary: Current ontology (Caliban Semantic Model) for a tenant
      parameters: [ { $ref: '#/components/parameters/TenantQuery' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ontology' }

  /api/v1/ontology/elements/{elementId}/review:
    parameters:
      - name: elementId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [ontology]
      summary: Approve or reject a proposed ontology element
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OntologyElement' }

  /api/v1/nodes:
    get:
      tags: [nodes]
      summary: List nodes (AI sub-apps)
      description: |
        Every version of every node by default (with its spec). `view=summary` lists one entry per
        node instead (no specs): its live version, its latest version and state, version counts and
        when it last changed.
      parameters:
        - { $ref: '#/components/parameters/TenantQuery' }
        - { name: view, in: query, schema: { type: string, enum: [versions, summary], default: versions } }
      responses:
        '200':
          description: 'Versions (`Node`), or summaries (`NodeSummary`) with `view=summary`'
          content:
            application/json:
              schema:
                oneOf:
                  - { type: array, items: { $ref: '#/components/schemas/Node' } }
                  - { type: array, items: { $ref: '#/components/schemas/NodeSummary' } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [nodes]
      summary: Create a draft node version (same as POST /api/v1/tenants/{tenantId}/nodes/{nodeName}/versions)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }

  /api/v1/tenants/{tenantId}/tool-servers:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [tools]
      summary: Registered MCP tool servers (tools.read)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ToolServer' } }
    post:
      tags: [tools]
      summary: Register an MCP tool server (tools.write)
      description: |
        Registering a server is what allows node tools to reach it (the egress allowlist). The URL must be
        Streamable HTTP (`http` or `https`; stdio servers are not supported) and pass the egress rules (no
        link-local or metadata addresses; loopback only with `CALIBAN_MCP_ALLOW_LOOPBACK`). `credential` is
        sealed under the tenant's data key at once and never returned. Audited (`tool_server.create`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolServerCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolServer' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/tool-servers/{server}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: server, in: path, required: true, schema: { type: string } }
    delete:
      tags: [tools]
      summary: Delete a tool server (tools.write)
      description: Soft delete; its credential is wiped and its tools leave the data plane. `409` while a published node version uses it (change it in place with `PATCH` instead).
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      tags: [tools]
      summary: Change a tool server (tools.write)
      description: |
        Absent fields are kept. A new `credential` is sealed at once and never returned (rotation);
        `null` removes it (refused when the auth method needs one). The auth method, the credential
        and `trusted` keep the approvals; a new `url` withdraws every approval of the server's
        manifests (discover and approve again; published versions calling its tools fail until then).
        The URL (and an OAuth token URL) must pass the egress rules (`422`). Audited as
        `tool_server.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url: { type: string }
                auth: { $ref: '#/components/schemas/ToolAuth' }
                credential: { type: [string, 'null'] }
                trusted: { type: boolean }
      responses:
        '200':
          description: The server
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ToolServer'
                  - type: object
                    required: [approvals_withdrawn]
                    properties:
                      approvals_withdrawn: { type: integer, description: 'Approvals the URL change withdrew' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/tool-servers/{server}/discover:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: server, in: path, required: true, schema: { type: string } }
    post:
      tags: [tools]
      summary: Discover a server's tools (tools.write)
      description: |
        The control plane connects through the egress guard (with a discovery token for `caliban_token` servers),
        lists the tools, pins each manifest and runs the injection scan. A manifest seen with a new pin is a new,
        `discovered` record: a server cannot change an approved tool. Audited (`tool.discover`).
      responses:
        '200':
          description: The manifests the server lists now
          content:
            application/json:
              schema:
                type: object
                properties:
                  server: { type: string }
                  tools: { type: array, items: { $ref: '#/components/schemas/ToolManifest' } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/tool-servers/{server}/tools:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: server, in: path, required: true, schema: { type: string } }
    get:
      tags: [tools]
      summary: Every manifest recorded for the server, with pins, scan findings and status (tools.read)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ToolManifest' } }
    post:
      tags: [tools]
      summary: Import manifests (a server the control plane cannot reach) (tools.write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifests]
              additionalProperties: false
              properties:
                manifests:
                  type: array
                  items:
                    type: object
                    required: [name, description, input_schema]
                    properties:
                      name: { type: string }
                      description: { type: string }
                      input_schema: { type: object, additionalProperties: {}, description: 'The tool''s input JSON Schema (any JSON object)' }
      responses:
        '200':
          description: The recorded manifests
          content:
            application/json:
              schema:
                type: object
                properties:
                  server: { type: string }
                  tools: { type: array, items: { $ref: '#/components/schemas/ToolManifest' } }

  /api/v1/tenants/{tenantId}/tool-servers/{server}/tools/{tool}/approve:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: server, in: path, required: true, schema: { type: string } }
      - { name: tool, in: path, required: true, schema: { type: string } }
    post:
      tags: [tools]
      summary: Approve a manifest by pin (tools.approve)
      description: |
        Only approved manifests reach the data plane and can be pinned by a published node version. A manifest
        with scan findings needs `acknowledge_findings: true` (`422` otherwise). Audited (`tool.approve`, with the
        findings, the acknowledgement and the network decision). `network` records whether the tool reaches the
        network through its arguments (a URL, a host): a read through such a tool is gated like a write (tainted
        arguments need an `allow_tainted` entry or a human approval). Absent: the input schema's hints decide
        (`network_hint` on the manifest). To change it, revoke and approve again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              additionalProperties: false
              properties:
                pin: { type: string, description: 'sha256:<hex>' }
                acknowledge_findings: { type: boolean, default: false }
                network: { type: boolean, description: 'The tool reaches the network through its arguments (overrides the schema hints)' }
      responses:
        '200':
          description: Approved; `ref` is what node specs pin
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool: { $ref: '#/components/schemas/ToolManifest' }
                  ref: { type: string, description: 'mcp://server/tool#sha256:<hex>' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{tenantId}/tool-servers/{server}/tools/{tool}/revoke:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: server, in: path, required: true, schema: { type: string } }
      - { name: tool, in: path, required: true, schema: { type: string } }
    post:
      tags: [tools]
      summary: Withdraw the approval of a manifest (tools.approve)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pin], properties: { pin: { type: string } } }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }

  /.well-known/caliban-tool-jwks.json:
    get:
      tags: [tools]
      security: []
      summary: The public keys tool servers verify minted tool tokens with
      description: |
        The current and previous `CALIBAN_TOOL_TOKEN_*` public keys (RFC 8037 OKP, Ed25519, `alg: EdDSA`). Tokens are
        minted per call, audience-bound (the server's audience), scoped to one tool (`scope: tool:<name>`) and live
        60 seconds. Empty without a key.
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty: { type: string, enum: [OKP] }
                        crv: { type: string, enum: [Ed25519] }
                        alg: { type: string, enum: [EdDSA] }
                        use: { type: string, enum: [sig] }
                        kid: { type: string }
                        x: { type: string }

  /api/v1/usage:
    get:
      tags: [usage]
      summary: Recent usage events and aggregate savings
      description: |
        With the Postgres store, from `usage_event`: every data plane's events (split-mode routers ship theirs
        through `POST /api/v1/usage/ingest`), totals over all of them, including the days rolled up into
        `usage_daily` once raw events pass `CALIBAN_USAGE_RETENTION_DAYS` (the totals do not change). With the
        in-memory store, the last 10,000 events of the process. `node` and `run_id` filter node calls; `by_node`
        totals each node version (cost per node); a `run_id` covers raw events only. `from` and `to`
        limit the events, the totals and `by_node` to `from <= ts < to`; a rolled-up day counts when its
        start (00:00 UTC) is in the range.

        **Routing decisions are content-class** (which intent requests go to reveals topics, arXiv
        2610.09981): events come without `intent`, `intent_confidence`, `route_stage`, `route` and
        `route_fallback` (empty or absent), and `by_route` counts requests per tenant, UTC day, intent,
        deciding stage and fallback reason instead (not with `node` or `run_id`).
      parameters:
        - { $ref: '#/components/parameters/TenantQuery' }
        - { name: node, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: 'Events at or after this time (RFC 3339)' }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: 'Events before this time; `400` unless after `from`' }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageReport' }

  /api/v1/tenants/{tenantId}/routes:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [tenants]
      summary: Tenant routes (intent → ordered candidate models)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Route' } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [tenants]
      summary: Replace the tenant's routes
      description: Rejected with 422 (nothing written) if a route names a model the tenant cannot reach.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutesPut' }
      responses:
        '200':
          description: The routes now in effect
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Route' } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/audit:
    get:
      tags: [system]
      summary: Tamper-evident audit log (newest first)
      description: |
        One row per control-plane mutation. `hash = sha256(prev_hash ‖ canonical_json({seq, ts, tenant_id, actor,
        action, target, detail}))` with sorted keys, no whitespace, `ts` in RFC 3339 UTC with microseconds, and 32 zero
        bytes as `prev_hash` for the first row. `chain_verified` re-checks the returned window. Never contains secrets.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLog' }

  /api/v1/keys/status:
    get:
      tags: [system]
      summary: KEK rotation status (the same report as `caliban keys status`)
      description: |
        Which KEK wraps each tenant data key and seals each shared provider key, what still waits for migration,
        whether the retired keys in `CALIBAN_KEK_PREVIOUS` are still needed by stored data
        (`previous_keks_still_needed`), and what each split-mode router reported on its last snapshot poll
        (`routers`: `active` when seen within 10 minutes, `snapshot_version`, `snapshot_kek_ids`, `keyring`,
        `needs_previous_kek`, `has_current_kek`). `routers_on_previous_keks` lists the active routers whose snapshot
        still needs a retired KEK; `rotation_complete` is true when neither stored data nor an active router does,
        which is when `CALIBAN_KEK_PREVIOUS` can be removed. Needs `audit.read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/roles:
    get:
      tags: [auth]
      summary: The roles and the permissions each grants
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleInfo' } }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/users:
    get:
      tags: [auth]
      summary: Users known from the identity provider (created just in time)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/users/{userId}/sessions:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [auth]
      summary: Sign the user out everywhere (revokes every active session)
      description: Audited as `user.sessions_revoke`.
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/role-bindings:
    get:
      tags: [auth]
      summary: Stored role bindings, and the group mappings from the config file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBindingList' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [auth]
      summary: Grant a role to a user or an identity-provider group
      description: |
        Deployment roles (`owner`, `admin`, `auditor`) take no `tenant_id`; tenant roles (`tenant_admin`,
        `developer`, `viewer`, `billing`) need one (`422` otherwise). Only an owner can grant `owner`
        (`403`). A user subject must be a user id (`404` if unknown). Takes effect on the next request.
        Audited as `role_binding.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleBindingCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/role-bindings/{bindingId}:
    parameters:
      - { name: bindingId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [auth]
      summary: Revoke a role binding
      description: Only an owner can revoke an `owner` binding. Audited as `role_binding.delete`.
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /auth/config:
    get:
      tags: [auth]
      security: []
      summary: How the console should offer login (public)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }

  /auth/login:
    get:
      tags: [auth]
      security: []
      summary: Start single sign-on (browser navigation)
      description: |
        Redirects (303) to the identity provider (authorization code flow with PKCE) and sets a short-lived
        login cookie. On failure to reach the provider, redirects to `/#/login?error=idp_unavailable`.
      parameters:
        - name: return_to
          in: query
          required: false
          description: Path on the console to come back to (same origin only), e.g. `/#/tenants`.
          schema: { type: string }
      responses:
        '303': { description: To the identity provider }
        '404': { $ref: '#/components/responses/Error' }

  /auth/callback:
    get:
      tags: [auth]
      security: []
      summary: Identity provider redirect target (browser navigation)
      description: |
        Validates the state, the login cookie and the ID token, creates the session cookie (HttpOnly,
        SameSite=Strict) and redirects (303) to `return_to`. Failures redirect to
        `/#/login?error=login_failed` (audited as `auth.login_failed`) or `/#/login?error=login_expired`.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '303': { description: To the console }

  /auth/logout:
    post:
      tags: [auth]
      security: [ { session: [] } ]
      summary: End the console session
      description: Needs `X-CSRF-Token`. Clears the cookie; audited as `auth.logout`.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [end_session_url]
                properties:
                  end_session_url:
                    type: [string, 'null']
                    description: The provider's logout URL (RP-initiated logout), if it has one.
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [auth]
      security: [ { session: [] }, { bearer: [] } ]
      summary: The authenticated caller, roles and effective permissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/usage/ingest:
    post:
      tags: [system]
      summary: Usage events from a split-mode router
      description: |
        Authenticated with the router token (`CALIBAN_ROUTER_TOKEN`), not the admin token. Each `request_id` is
        stored once: a batch sent again (lost acknowledgement, router restart) is answered with `duplicates` and
        not counted again. Invalid events (empty or oversized ids) are counted as `rejected` and dropped. Billing
        fields are stored as the router computed them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                router_id: { type: string }
                events:
                  type: array
                  maxItems: 5000
                  items: { $ref: '#/components/schemas/UsageEvent' }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates, rejected]
                properties:
                  accepted: { type: integer, description: Events stored for the first time }
                  duplicates: { type: integer, description: Events already stored; ignored }
                  rejected: { type: integer, description: Invalid events; ignored }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/audit/ingest:
    post:
      tags: [system]
      summary: Run decisions from the data plane
      description: |
        Authenticated with the router token. Workers deliver the decisions made on the data plane
        (`node.run.answer`, `node.write.approve`, `node.write.deny`, `node.run.cancel`) at least once;
        each event id is recorded once in the hash-chained audit log, so a retry appends nothing.
        Other actions are `rejected`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                router_id: { type: string }
                events:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [id, tenant_id, actor, action, detail, at]
                    properties:
                      id: { type: string, description: 'Stable: `<run>/<step>/answer`, `<run>/cancel`' }
                      tenant_id: { type: string }
                      actor: { type: string }
                      action: { type: string }
                      target: { type: [string, 'null'] }
                      detail: { type: object, additionalProperties: true }
                      at: { type: string, format: date-time }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates, rejected]
                properties:
                  accepted: { type: integer }
                  duplicates: { type: integer }
                  rejected: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/snapshot:
    get:
      tags: [system]
      summary: Signed data-plane config snapshot (split mode; for routers)
      description: |
        Authenticated with the router token (`CALIBAN_ROUTER_TOKEN`), not the admin token. Enabled only when the
        control plane has `CALIBAN_SNAPSHOT_SIGNING_KEY` and `CALIBAN_ROUTER_TOKEN`. The ETag is a digest of the
        config; send it back in `If-None-Match` to get 304 while nothing changed. Verify `signature` (Ed25519 over
        `"caliban-snapshot-v1\0" ‖ base64-decoded payload`) before parsing `payload`. Sealed BYOK keys stay sealed.

        Routers check in with every poll through the `x-caliban-router-*` headers (what they serve); the control
        plane records them for `GET /api/v1/keys/status`. Polls without `x-caliban-router-id` are not recorded.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
        - name: x-caliban-router-id
          in: header
          required: false
          description: The router's id (`CALIBAN_ROUTER_ID`, else its host name); 1 to 128 of `[A-Za-z0-9._:-]`.
          schema: { type: string }
        - name: x-caliban-router-snapshot
          in: header
          required: false
          description: Version label of the snapshot the router serves.
          schema: { type: string }
        - name: x-caliban-router-snapshot-kek-ids
          in: header
          required: false
          description: Comma-separated `kek_ids` of the snapshot the router serves.
          schema: { type: string }
        - name: x-caliban-router-keyring
          in: header
          required: false
          description: Comma-separated ids of the router's own keyring, current KEK first.
          schema: { type: string }
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
            x-caliban-snapshot-version: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedSnapshot' }
        '304': { description: Unchanged since the given ETag }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Tenant API key (`cal_…`) on the data plane. On the control plane: an OIDC access token for the
        configured `api_audience`, or the break-glass bootstrap token.
    session:
      type: apiKey
      in: cookie
      name: __Host-caliban_session
      description: |
        Console session from `/auth/callback` (`caliban_session` when the console is served over plain
        http). Requests that change something also send the `X-CSRF-Token` header from `/auth/me`.
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Tenant API key (`cal_…`) as sent by Anthropic SDKs (data plane only).

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string }
    NodeName:
      name: nodeName
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
    NodeVersion:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TenantQuery:
      name: tenant_id
      in: query
      required: false
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        A rate limit or token budget was exceeded (`[limits]` in the config). `error.type` is
        `rate_limited`; `error.code` names the limit (`requests_per_minute`,
        `key_requests_per_minute`, `tokens_per_minute`, `tokens_per_day`, `usd_per_day`).
      headers:
        retry-after: { schema: { type: integer }, description: 'Seconds until the request can succeed.' }
        x-caliban-ratelimit-scope: { schema: { type: string }, description: 'The limit that was hit (same as error.code).' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AnthropicError:
      description: Error (Anthropic shape)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AnthropicError' }
    Overloaded:
      description: |
        The PII model's queue is full (`CALIBAN_PII_NER_OVERFLOW=reject`, the default). The request
        was not sent upstream; retry after `retry-after` seconds. `error.type` is `overloaded`.
      headers:
        retry-after: { schema: { type: integer }, description: 'Seconds to wait before retrying.' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AnthropicOverloaded:
      description: The PII model's queue is full (Anthropic shape, `error.type` = `overloaded_error`). Nothing was sent upstream.
      headers:
        retry-after: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AnthropicError' }
    AnthropicRateLimited:
      description: Rate limit or token budget exceeded (Anthropic shape, `error.type` = `rate_limit_error`).
      headers:
        retry-after: { schema: { type: integer } }
        x-caliban-ratelimit-scope: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AnthropicError' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type: { type: string, description: 'e.g. invalid_request_error, authentication_error, permission_error, policy_violation, upstream_error, rate_limited' }
            code: { type: [string, 'null'], description: 'For rate_limited: the limit that was hit (e.g. tokens_per_minute). `validation_failed` when a node version cannot be created, published or promoted (see `problems`).' }
            problems:
              type: array
              description: 'Node version refusals (`422`, `validation_failed`): every reason, one by one, next to `message` (which joins them).'
              items: { $ref: '#/components/schemas/Problem' }

    Problem:
      type: object
      required: [kind, message]
      properties:
        kind: { type: string, enum: [spec, tool, datasource_scope, budget, node_ref, cycle, eval_gate, golden_set, allowlist], description: '`allowlist` appears in `warnings` only' }
        message: { type: string }
        path: { type: string, description: 'Where in the spec: `tools[0]`, `datasources.scopes[1]`, `budgets.steps`, `node://risk@v2` (for `eval_gate`: the subnode whose own gate failed)' }

    Health:
      type: object
      required: [status, version, mode]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        mode: { type: string, enum: [router, control-plane, standalone] }
        config_version: { type: [string, 'null'] }
        store: { type: string, enum: [memory, postgres], description: 'Control plane only: active store backend' }

    CalibanExtension:
      type: object
      description: Caliban-specific request options. Unknown to OpenAI clients; safe to omit.
      properties:
        pii: { type: string, enum: [off, mask, reversible], default: reversible }
        cache: { type: string, enum: [off, exact, semantic], default: exact, description: '`off`: no cache. `exact`: exact cache only. `semantic`: exact, then the semantic cache when the tenant has it on, whatever the temperature (without it, the semantic cache applies only up to `[cache.semantic] max_temperature`). Unset: exact, plus semantic within the temperature limit when the tenant has it on.' }
        datasources: { type: array, items: { type: string } }
        node: { type: string }
        max_cost_usd: { type: number }
        reasoning: { type: string, enum: [off, low, medium, high], description: 'Mapped per model family (Qwen3 enable_thinking, reasoning_effort). OpenAI reasoning_effort is also accepted.' }
        zdr: { type: boolean, default: false }
        trace_id: { type: string }
        untrusted:
          description: '`model: "node/<name>"` (and caliban/auto handing the request to a node): the node input the caller marks as untrusted data (taint label `caller`), `true` or JSON pointers into the node''s input. See `POST /v1/nodes/{name}/runs`.'
          oneOf:
            - type: boolean
            - type: array
              maxItems: 64
              items: { type: string, pattern: '^(/.*)?$' }

    ChatMessage:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [system, developer, user, assistant, tool] }
        content:
          oneOf:
            - type: string
            - type: array
              items: { type: object, additionalProperties: true }
            - type: 'null'
        name: { type: string }
        tool_calls: { type: array, items: { type: object, additionalProperties: true } }
        tool_call_id: { type: string }
        reasoning_content: { type: [string, 'null'], description: 'Reasoning text from reasoning models (responses only). Some servers name it `reasoning`.' }
        reasoning: { type: [string, 'null'], description: 'Alias of reasoning_content used by some servers.' }

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model: { type: string, description: 'Registry model id, tenant alias, or caliban/auto' }
        messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        stream: { type: boolean, default: false }
        temperature: { type: number }
        max_tokens: { type: integer }
        tools: { type: array, items: { type: object, additionalProperties: true } }
        caliban: { $ref: '#/components/schemas/CalibanExtension' }

    ChatCompletionResponse:
      type: object
      additionalProperties: true
      required: [id, object, model, choices]
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason: { type: [string, 'null'] }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }

    AnthropicError:
      type: object
      required: [type, error]
      properties:
        type: { type: string, const: error }
        error:
          type: object
          required: [type, message]
          properties:
            type: { type: string, description: 'invalid_request_error, authentication_error, permission_error, rate_limit_error, api_error' }
            message: { type: string }

    AnthropicMessagesRequest:
      type: object
      required: [model, max_tokens, messages]
      additionalProperties: true
      description: Anthropic Messages request. Unknown fields pass through to Anthropic models on native passthrough.
      properties:
        model: { type: string, description: 'Registry model id, tenant alias, or caliban/auto' }
        max_tokens: { type: integer, description: 'Not required by count_tokens.' }
        system:
          oneOf:
            - type: string
            - type: array
              items: { type: object, additionalProperties: true, description: 'text block (cache_control allowed)' }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content:
                oneOf:
                  - type: string
                  - type: array
                    items: { type: object, additionalProperties: true, description: 'text | image | document | tool_use | tool_result | thinking block' }
        tools: { type: array, items: { type: object, additionalProperties: true } }
        tool_choice: { type: object, additionalProperties: true }
        stop_sequences: { type: array, items: { type: string } }
        temperature: { type: number }
        top_p: { type: number }
        stream: { type: boolean }
        thinking: { type: object, additionalProperties: true, description: 'enabled (budget_tokens) / disabled; mapped to caliban.reasoning for non-Anthropic models' }
        metadata: { type: object, properties: { user_id: { type: string } } }
        caliban: { $ref: '#/components/schemas/CalibanExtension' }

    AnthropicMessage:
      type: object
      additionalProperties: true
      required: [id, type, role, model, content, stop_reason, usage]
      properties:
        id: { type: string }
        type: { type: string, const: message }
        role: { type: string, const: assistant }
        model: { type: string, description: 'The Caliban model id that served the request' }
        content: { type: array, items: { type: object, additionalProperties: true } }
        stop_reason: { type: [string, 'null'], enum: [end_turn, max_tokens, stop_sequence, tool_use, refusal, pause_turn, null] }
        stop_sequence: { type: [string, 'null'] }
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cache_read_input_tokens: { type: integer }
            cache_creation_input_tokens: { type: integer }

    Tenant:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: [string, 'null'] }
        pii_default: { type: string, enum: [off, mask, reversible] }
        semantic_cache: { type: string, enum: ['off', 'on'], default: 'off', description: 'T2 semantic cache for this tenant. `on`: eligible requests may be answered with the response to an earlier, semantically similar request of the same tenant (per-entry learned thresholds, deployment error budget). Entries never cross tenants. Also needs `[cache.semantic] enabled`.' }
        pii_surrogate_scope: { type: string, enum: [tenant, session], default: tenant, description: 'Surrogate consistency for reversible PII. `tenant`: the same value always gets the same surrogate in this tenant (keyed HMAC per tenant, derived from CALIBAN_KEK), so pseudonymised requests can hit the exact cache; sessions of the tenant become linkable through their surrogates. `session`: fresh surrogates per request. Surrogates never cross tenants.' }
        auto_cache_hit_fraction: { type: [number, 'null'], minimum: 0, maximum: 1, description: 'Share of the flat `caliban/auto` price billed when a cache tier (exact or semantic) answers this tenant''s request: no model is called. `null`: the deployment''s `[routing] auto_cache_hit_fraction` (default 0.2) applies.' }
        node_caps: { oneOf: [ { $ref: '#/components/schemas/NodeCaps' }, { type: 'null' } ], description: '`null`: the defaults (steps 200, tokens 2000000, wall_clock_s 3600, depth 5, fanout 32).' }
        node_spend_caps: { oneOf: [ { $ref: '#/components/schemas/NodeSpendCaps' }, { type: 'null' } ], description: 'Caps on what the tenant''s node runs spend on model calls; `null`: none.' }
        node_routes: { $ref: '#/components/schemas/NodeRoutes' }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [active, deleted], description: '`deleted` only appears with `include_deleted=true`.' }
        deleted_at: { type: [string, 'null'], format: date-time }
    TenantCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        region: { type: string }
        pii_default: { type: string, enum: [off, mask, reversible], default: reversible }
        pii_surrogate_scope: { type: string, enum: [tenant, session], default: tenant }
        semantic_cache: { type: string, enum: ['off', 'on'], default: 'off' }
        auto_cache_hit_fraction: { type: [number, 'null'], minimum: 0, maximum: 1, description: 'Overrides `[routing] auto_cache_hit_fraction` for this tenant. Omitted or `null`: the deployment value.' }
        node_caps: { $ref: '#/components/schemas/NodeCaps' }
        node_spend_caps: { $ref: '#/components/schemas/NodeSpendCaps' }
        node_routes: { $ref: '#/components/schemas/NodeRoutes' }
    TenantUpdate:
      type: object
      additionalProperties: false
      properties:
        pii_default: { type: string, enum: [off, mask, reversible] }
        pii_surrogate_scope: { type: string, enum: [tenant, session] }
        semantic_cache: { type: string, enum: ['off', 'on'] }
        auto_cache_hit_fraction: { type: [number, 'null'], minimum: 0, maximum: 1, description: 'A number sets the override; `null` clears it (the deployment value applies); absent keeps it.' }
        node_caps: { oneOf: [ { $ref: '#/components/schemas/NodeCaps' }, { type: 'null' } ], description: 'Caps on the budgets of published node versions; `null` restores the defaults; absent keeps them.' }
        node_spend_caps: { oneOf: [ { $ref: '#/components/schemas/NodeSpendCaps' }, { type: 'null' } ], description: 'Daily and monthly caps on node spend; `null` removes them; absent keeps them.' }
        node_routes: { $ref: '#/components/schemas/NodeRoutes' }
    NodeRoutes:
      type: [object, 'null']
      additionalProperties: { type: string, pattern: '^node/[a-z0-9_-]+(@(v[1-9][0-9]*|published))?$' }
      description: |
        Intents `caliban/auto` hands to the tenant's nodes: intent id to `node/<name>` (the live
        version), `node/<name>@published` (the same) or `node/<name>@v<N>`. Overrides
        `[routing.tenants.<id>.routes]` of the config file, intent by intent. On update: `null`
        clears it, absent keeps it.
    NodeSpendCaps:
      type: object
      additionalProperties: false
      description: |
        Caps on what the tenant's node runs spend on model calls (USD, priced like the metering), per
        UTC day and month, across all workers: checked before every model call against the journal's
        per-day totals. A cap reached ends runs gracefully (`budget_exhausted`).
      properties:
        daily_usd: { type: number, minimum: 0 }
        monthly_usd: { type: number, minimum: 0 }
    NodeCaps:
      type: object
      additionalProperties: false
      required: [steps, tokens, wall_clock_s, depth, fanout]
      properties:
        steps: { type: integer, minimum: 1 }
        tokens: { type: integer, minimum: 1 }
        wall_clock_s: { type: integer, minimum: 1 }
        depth: { type: integer, minimum: 1 }
        fanout: { type: integer, minimum: 1 }
        usd: { type: number, exclusiveMinimum: 0, description: 'When set, every version must declare `budgets.usd` within it (the most one run may spend).' }

    ApiKeyInfo:
      type: object
      required: [id, name, prefix, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: 'First 8 chars, for display' }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time, description: 'Set once the key is revoked.' }
        nodes: { type: [array, 'null'], items: { type: string }, description: 'Node allowlist. `null`: every published node of the tenant; `[]`: none.' }
        datasource_scopes: { type: array, items: { type: string }, description: 'Datasource scopes the built-in query tool may read for this key (absent: every scope of the nodes it runs).' }
        purpose: { type: string, enum: [eval], description: '`eval`: the tenant''s eval key, managed by the control plane (absent on keys customers create)' }
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKeyInfo'
        - type: object
          required: [key]
          properties:
            key: { type: string, description: 'Plaintext key. Shown once.' }

    ProviderKind:
      type: string
      enum: [openai, anthropic, openai_compatible, azure_openai, bedrock, vertex]
      description: '`openai_compatible` covers on-prem vLLM, SGLang, llama.cpp, Ollama, mistral.rs.'
    TrustTier:
      type: string
      enum: [t0_sovereign, t1_attested, t2_contracted, t3_public]
    ProviderKey:
      type: object
      required: [id, tenant_id, kind, label, trust_tier, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        kind: { $ref: '#/components/schemas/ProviderKind' }
        label: { type: string }
        base_url: { type: [string, 'null'] }
        trust_tier: { $ref: '#/components/schemas/TrustTier' }
        last4: { type: [string, 'null'] }
        cache_salt: { type: boolean }
        created_at: { type: string, format: date-time }
    ProviderKeyCreate:
      type: object
      required: [kind, label, trust_tier]
      properties:
        kind: { $ref: '#/components/schemas/ProviderKind' }
        label: { type: string }
        provider_id: { type: string, description: 'Provider id referenced by the model catalogue (e.g. local-llm, openai). Defaults to the slugified label.' }
        base_url: { type: string }
        api_key: { type: string, description: 'Write-only. Sealed under the tenant data key (created on the first secret, wrapped by CALIBAN_KEK). Optional for keyless local endpoints.' }
        trust_tier: { $ref: '#/components/schemas/TrustTier' }
        cache_salt: { type: boolean, default: false, description: 'Send a per-tenant cache_salt (vLLM prefix-cache isolation)' }

    ModelKind:
      type: string
      enum: [chat, embedding, rerank]
    ModelCapabilities:
      type: object
      properties:
        tools: { type: boolean, default: false }
        vision: { type: boolean, default: false }
        reasoning: { type: string, enum: [none, always, hybrid], default: none }
        reasoning_control: { type: string, enum: [none, enable_thinking, reasoning_effort], default: none }
        inline_think_tags: { type: boolean, default: false, description: 'Server returns <think>…</think> in content; Caliban moves it to reasoning_content.' }
        rejects_stream_options: { type: boolean, default: false, description: 'The server rejects `stream_options`. Caliban then does not request usage on streams, and meters them from an estimate (`usage_source: estimated`). Leave false for servers that accept it (vLLM, SGLang, OpenAI).' }
    ModelCreate:
      type: object
      required: [id, provider, upstream_model, trust_tier]
      properties:
        id: { type: string, description: 'Caliban model id, e.g. local/qwen3-8b' }
        provider: { type: string, description: 'Shared provider id or a tenant BYOK provider id' }
        upstream_model: { type: string, description: 'Name the server expects, e.g. Qwen/Qwen3-8B' }
        kind: { $ref: '#/components/schemas/ModelKind' }
        family: { type: [string, 'null'] }
        capabilities: { $ref: '#/components/schemas/ModelCapabilities' }
        trust_tier: { $ref: '#/components/schemas/TrustTier' }
        licence: { type: [string, 'null'] }
        context_window: { type: [integer, 'null'] }
        price_in_per_mtok: { type: [number, 'null'] }
        price_out_per_mtok: { type: [number, 'null'] }
        price_cache_read_per_mtok: { type: [number, 'null'], minimum: 0, description: 'USD per million prompt tokens read from the provider prompt cache (OpenAI `cached_tokens`, Anthropic `cache_read_input_tokens`). Null: `price_in_per_mtok`.' }
        price_cache_write_per_mtok: { type: [number, 'null'], minimum: 0, description: 'USD per million prompt tokens written to the provider prompt cache (Anthropic `cache_creation_input_tokens`, 5-minute TTL). Null: `price_in_per_mtok`.' }
        price_cache_write_1h_per_mtok: { type: [number, 'null'], minimum: 0, description: 'USD per million tokens written with the Anthropic 1-hour TTL (`cache_creation.ephemeral_1h_input_tokens`). Null: `price_cache_write_per_mtok`.' }
    Model:
      type: object
      required: [id, provider_id, upstream_model, trust_tier, kind, capabilities]
      properties:
        id: { type: string }
        provider_id: { type: string }
        provider_kind: { oneOf: [ { $ref: '#/components/schemas/ProviderKind' }, { type: 'null' } ] }
        upstream_model: { type: string }
        kind: { $ref: '#/components/schemas/ModelKind' }
        family: { type: [string, 'null'] }
        capabilities: { $ref: '#/components/schemas/ModelCapabilities' }
        trust_tier: { $ref: '#/components/schemas/TrustTier' }
        licence: { type: [string, 'null'] }
        context_window: { type: [integer, 'null'] }
        price_in_per_mtok: { type: [number, 'null'] }
        price_out_per_mtok: { type: [number, 'null'] }
        price_cache_read_per_mtok: { type: [number, 'null'], minimum: 0, description: 'USD per million prompt tokens read from the provider prompt cache (OpenAI `cached_tokens`, Anthropic `cache_read_input_tokens`). Null: `price_in_per_mtok`.' }
        price_cache_write_per_mtok: { type: [number, 'null'], minimum: 0, description: 'USD per million prompt tokens written to the provider prompt cache (Anthropic `cache_creation_input_tokens`, 5-minute TTL). Null: `price_in_per_mtok`.' }
        price_cache_write_1h_per_mtok: { type: [number, 'null'], minimum: 0, description: 'USD per million tokens written with the Anthropic 1-hour TTL (`cache_creation.ephemeral_1h_input_tokens`). Null: `price_cache_write_per_mtok`.' }
    SharedProvider:
      type: object
      required: [id, kind, base_url, trust_tier, cache_salt, has_api_key, tenants]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ProviderKind' }
        base_url: { type: string }
        trust_tier: { $ref: '#/components/schemas/TrustTier' }
        cache_salt: { type: boolean, description: 'Send a per-tenant cache_salt (vLLM prefix-cache isolation)' }
        has_api_key: { type: boolean }
        tenants: { type: array, items: { type: string }, description: 'Allow-list; empty = all tenants' }
    SharedProviderCreate:
      type: object
      required: [id, kind, base_url, trust_tier]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ProviderKind' }
        base_url: { type: string, description: 'e.g. http://qwen3-30b:8000/v1' }
        trust_tier: { $ref: '#/components/schemas/TrustTier' }
        cache_salt: { type: boolean, default: false }
        api_key: { type: string, description: 'Write-only. Sealed under the current CALIBAN_KEK (re-sealed by `caliban keys rotate`).' }
        tenants: { type: array, items: { type: string } }

    DatasourceKind:
      type: string
      enum: [mongodb, postgres, mysql, sqlserver, snowflake, bigquery, clickhouse, elasticsearch, rest_openapi, s3_parquet, mcp]
    Datasource:
      type: object
      required: [id, tenant_id, kind, name, status]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        kind: { $ref: '#/components/schemas/DatasourceKind' }
        name: { type: string }
        status: { type: string, enum: [pending, connected, error, introspecting] }
        epoch: { type: integer, description: 'Monotonic data version used for cache invalidation' }
        connection:
          type: object
          additionalProperties: true
          description: 'Redacted connection settings: credentials are shown masked (`****`, or a URI as `scheme://user:****@host`); `{env}`/`{file}` references are shown as they are. Credentials are never returned.'
    DatasourceCreate:
      type: object
      required: [tenant_id, kind, name, connection]
      properties:
        tenant_id: { type: string }
        kind: { $ref: '#/components/schemas/DatasourceKind' }
        name: { type: string }
        connection:
          type: object
          additionalProperties: true
          description: 'Kind-specific connection settings. Credentials (password, api_key, token, client_secret, private_key, credentials and similar fields, URIs with a password, secret query parameters, `Password=...;` pairs) are sealed under the tenant data key before they are stored; `{"env": ...}` and `{"file": ...}` references are kept as references. Keys named `$sealed` or `$redacted` are rejected (400). Storing credentials needs CALIBAN_KEK on the control plane (400 otherwise).'

    OntologyElementKind:
      type: string
      enum: [entity, attribute, relation, metric, dimension, glossary_term, policy, verified_query]
    OntologyElement:
      type: object
      required: [id, kind, name, status, provenance]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/OntologyElementKind' }
        name: { type: string }
        description: { type: [string, 'null'] }
        synonyms: { type: array, items: { type: string } }
        status: { type: string, enum: [proposed, approved, rejected, stale, deprecated] }
        provenance: { type: string, enum: [introspect, profile, query_log, llm, human] }
        confidence: { type: [number, 'null'] }
        spec: { type: object, additionalProperties: true, description: 'Kind-specific body; see schemas/ontology.schema.json' }
    Ontology:
      type: object
      required: [tenant_id, version, elements]
      properties:
        tenant_id: { type: string }
        version: { type: integer }
        elements: { type: array, items: { $ref: '#/components/schemas/OntologyElement' } }

    Node:
      description: One immutable node version.
      type: object
      required: [id, tenant_id, name, version, spec, hash, state, live, created_at]
      properties:
        id: { type: string, description: 'Record id (DELETE /api/v1/tenants/{tenantId}/nodes/{id})' }
        tenant_id: { type: string }
        name: { type: string }
        version: { type: integer }
        spec: { type: object, additionalProperties: true, description: 'See schemas/node.schema.json' }
        hash: { type: string, description: '`sha256:<hex>` over the canonical spec JSON (keys sorted, no whitespace). Stable across key order and formatting.' }
        state: { type: string, enum: [draft, published, retired] }
        live: { type: boolean, description: 'The promotion pointer names this version.' }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, 'null'] }
        published_at: { type: [string, 'null'], format: date-time }
        retired_at: { type: [string, 'null'], format: date-time }
        warnings:
          type: array
          description: 'Broad `allow_tainted` entries (`*`, or a `tool:` pattern wider than one server): standing authority for tainted writes. Warnings, not refusals: the injection suite runs every version with its real allowlist.'
          items:
            type: object
            required: [kind, message]
            properties:
              kind: { type: string, enum: [allowlist] }
              message: { type: string }
              path: { type: string, description: 'e.g. `tools[1].allow_tainted[0]`' }
    GoldenCase:
      type: object
      required: [id, input]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
        input: { description: 'The run input (checked against prompt.input_schema)' }
        expected: { description: 'Shorthand for an exact check' }
        checks:
          type: array
          items: { $ref: '#/components/schemas/EvalCheck' }
        answers:
          type: object
          additionalProperties: true
          description: 'Scripted answers to human steps, by step id (`clarify#0`, `write#0@approve`) or vertex id (`clarify`, `write@approve`). A question without one fails the trial; a tainted write without one is denied.'
        tags: { type: array, items: { type: string } }
    EvalCheck:
      description: 'A check of the run output. Text checks see the output as text (a string as is, other JSON compact).'
      oneOf:
        - type: object
          required: [type, value]
          properties:
            type: { const: exact }
            value: { description: 'A string compares with the output text; any other JSON with the output parsed as JSON' }
            strip: { type: boolean, default: true }
            case_sensitive: { type: boolean, default: true }
        - type: object
          required: [type, value]
          properties:
            type: { const: contains }
            value: { oneOf: [ { type: string }, { type: array, items: { type: string } } ] }
            case_sensitive: { type: boolean, default: true }
        - type: object
          required: [type, pattern]
          properties:
            type: { const: regex }
            pattern: { type: string }
            flags: { type: array, items: { type: string, enum: [IGNORECASE, MULTILINE, DOTALL] } }
        - type: object
          required: [type, schema]
          properties:
            type: { const: json_schema }
            schema: { type: object, description: 'The JSON Schema subset node specs use' }
        - type: object
          required: [type, rubric]
          properties:
            type: { const: llm_judge }
            rubric: { type: string }
            model: { type: string, description: 'Default: the eval''s judge_model, else caliban/auto. Called through the gateway as the eval''s API key.' }
            threshold: { type: number, minimum: 0, maximum: 1, default: 0.5 }
    GoldenSet:
      type: object
      required: [object, node, version, hash, case_count, updated_at, updated_by, content_visible]
      properties:
        object: { type: string, enum: [node.golden_set] }
        node: { type: string }
        version: { type: integer }
        hash: { type: string, description: '`sha256:<hex>` of the cases'' canonical JSON' }
        case_count: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        content_visible: { type: boolean, description: 'The caller holds runs.data: `cases` is included' }
        cases: { type: array, items: { $ref: '#/components/schemas/GoldenCase' } }
    EvalPolicy:
      type: object
      additionalProperties: false
      properties:
        golden:
          type: object
          additionalProperties: false
          required: [min_pass_k]
          properties:
            min_pass_k: { type: number, minimum: 0, maximum: 1, description: 'Least pass^k: the share of cases whose k runs all passed' }
            min_k: { type: integer, minimum: 1, maximum: 10, default: 1 }
            max_cost_per_success_usd: { type: number, exclusiveMinimum: 0 }
            max_p95_latency_ms: { type: integer, minimum: 1 }
        injection:
          type: object
          additionalProperties: false
          required: [min_pass_rate]
          properties:
            min_pass_rate: { type: number, minimum: 0, maximum: 1, description: 'Least share of attacks blocked. Default 1 (every attack). An injection eval is required for versions with write tools whatever the bar.' }
    EvalPolicyView:
      type: object
      required: [object, node, policy, injection_bar]
      properties:
        object: { type: string, enum: [node.eval_policy] }
        node: { type: string }
        policy: { $ref: '#/components/schemas/EvalPolicy' }
        injection_bar: { type: number, description: 'The injection bar in effect for versions with write tools (default 1)' }
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by: { type: [string, 'null'] }
    GateEvidence:
      type: object
      description: 'The evals that met the bar (in the audit entries `node.publish` and `node.promote` as `evals`)'
      properties:
        golden:
          type: object
          required: [eval, k, pass_hat_k]
          properties:
            eval: { type: string }
            k: { type: integer }
            pass_hat_k: { type: number }
        injection:
          type: object
          required: [eval, pass_rate, bar]
          properties:
            eval: { type: string }
            pass_rate: { type: number }
            bar: { type: number }
        subnodes:
          type: object
          description: 'Per pinned subnode version (`name@vN`): its own evidence, or null when no gate applies to it'
          additionalProperties:
            oneOf: [ { $ref: '#/components/schemas/GateEvidence' }, { type: 'null' } ]
    LatencyPercentiles:
      type: object
      required: [p50, p95]
      properties:
        p50: { type: [integer, 'null'], description: 'Nearest rank, ms' }
        p95: { type: [integer, 'null'] }
    GoldenSummary:
      type: object
      required: [suite, k, cases, trials, passed_trials, errors, pass_hat_k, pass_at_1, pass_at_k, cost_usd, judge_cost_usd, tokens, latency_ms, by_case]
      properties:
        suite: { type: string, enum: [golden] }
        k: { type: integer }
        cases: { type: integer }
        trials: { type: integer }
        passed_trials: { type: integer }
        errors: { type: integer }
        pass_hat_k: { type: number, description: 'pass^k: the share of cases whose k runs all passed' }
        pass_at_1: { type: number }
        pass_at_k: { type: number }
        cost_usd: { type: number }
        cost_per_success_usd: { type: [number, 'null'] }
        judge_cost_usd: { type: number }
        tokens: { type: integer }
        latency_ms: { $ref: '#/components/schemas/LatencyPercentiles' }
        by_case:
          type: array
          items:
            type: object
            required: [case, trials, passed, all_passed]
            properties:
              case: { type: string }
              trials: { type: integer }
              passed: { type: integer }
              all_passed: { type: boolean }
        golden_hash: { type: string }
        judge:
          type: object
          properties:
            default_model: { type: string }
            prompt_version: { type: integer }
            prompt_sha256: { type: string }
            temperature: { type: number }
    InjectionSummary:
      type: object
      required: [suite, suite_version, trials, blocked, pass_rate, attack_success_rate, attacks_succeeded, errors, attacked, utility_under_attack, by_category, not_applicable, cost_usd, latency_ms, cases]
      properties:
        suite: { type: string, enum: [injection] }
        suite_version: { type: integer }
        trials: { type: integer }
        blocked: { type: integer }
        pass_rate: { type: number, description: 'Share of attacks blocked' }
        attack_success_rate: { type: number }
        attacks_succeeded: { type: integer }
        errors: { type: integer }
        attacked: { type: integer, description: 'Trials where the model followed the injection' }
        utility_under_attack: { type: number, description: 'Share of runs that still did their job' }
        by_category:
          type: object
          additionalProperties:
            type: object
            required: [trials, blocked, pass_rate]
            properties:
              trials: { type: integer }
              blocked: { type: integer }
              pass_rate: { type: number }
        not_applicable:
          type: array
          description: 'Cases this version offers no surface for, with why'
          items:
            type: object
            required: [case, reason]
            properties:
              case: { type: string }
              reason: { type: string }
        cost_usd: { type: number }
        latency_ms: { $ref: '#/components/schemas/LatencyPercentiles' }
        cases:
          type: array
          items:
            type: object
            required: [case, trial, blocked]
            properties:
              case: { type: string }
              trial: { type: integer }
              blocked: { type: boolean }
              attacked: { type: [boolean, 'null'] }
              defenses: { type: [array, 'null'], items: { type: string } }
              run_id: { type: [string, 'null'] }
    GoldenVerdict:
      type: object
      required: [run_status, checks]
      properties:
        run_status: { $ref: '#/components/schemas/RunStatus' }
        checks:
          type: array
          items:
            type: object
            required: [type, passed]
            properties:
              type: { type: string, enum: [exact, contains, regex, json_schema, llm_judge] }
              passed: { type: boolean }
              score: { type: [number, 'null'], description: 'The judge''s score (llm_judge)' }
        judge_usd: { type: number }
    InjectionVerdict:
      type: object
      required: [case, category, succeeded, attacked, defenses, tool_calls]
      properties:
        case: { type: string }
        category: { type: string, enum: [tainted_write, exfiltration, pii_leak, tool_poisoning, replay, subnode, caller_data] }
        succeeded: { type: boolean, description: 'The attack reached its goal' }
        attacked: { type: boolean, description: 'The model followed the injection' }
        defenses: { type: array, items: { type: string, enum: [approval_required, pii_guard, declared_tools_only, manifest_scan] } }
        tool_calls: { type: integer, description: 'Sandboxed calls of the run' }
        utility: { type: boolean, description: 'The run still did its job (absent for the manifest scan)' }
        run_status: { $ref: '#/components/schemas/RunStatus' }
    Eval:
      type: object
      required: [id, object, node, version, hash, suite, k, status, case_count, created_at]
      properties:
        id: { type: string }
        object: { type: string, enum: [node.eval] }
        node: { type: string }
        version: { type: integer }
        hash: { type: string }
        suite: { type: string, enum: [golden, injection] }
        k: { type: integer }
        concurrency: { type: integer }
        case_count: { type: integer }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        created_by: { type: string }
        api_key_id: { type: [string, 'null'] }
        summary:
          description: 'Metrics only, never content; null until the eval ends. The shape follows `suite`.'
          oneOf:
            - $ref: '#/components/schemas/GoldenSummary'
            - $ref: '#/components/schemas/InjectionSummary'
            - type: 'null'
        error: { type: [string, 'null'] }
        cancel_requested: { type: boolean }
        cancelled_by: { type: [string, 'null'] }
        claims: { type: integer }
        content_purged: { type: boolean, description: 'Run retention cleared the eval''s sealed content (trial `detail`, the plan); the summary and verdicts stay' }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        trials:
          type: array
          description: 'Detail only.'
          items:
            type: object
            properties:
              case: { type: string }
              trial: { type: integer }
              run_id: { type: [string, 'null'] }
              status: { type: string, enum: [running, passed, failed, error] }
              cost_usd: { type: number }
              latency_ms: { type: integer }
              tokens: { type: integer }
              verdict:
                description: 'Metadata, never content. The shape follows the eval''s suite; `{"error"}` when the trial''s run could not be created.'
                oneOf:
                  - $ref: '#/components/schemas/GoldenVerdict'
                  - $ref: '#/components/schemas/InjectionVerdict'
                  - type: object
                    required: [error]
                    properties: { error: { type: string } }
              detail: { description: 'With runs.data only: the output and what the scorers said, or what the sandboxed tools received' }
              finished_at: { type: [string, 'null'], format: date-time }
        content_visible: { type: boolean }
    NodeRun:
      type: object
      required: [id, object, node, version, hash, status, steps, budget, created_at]
      properties:
        id: { type: string }
        object: { type: string, enum: [node.run] }
        node: { type: string }
        version: { type: integer }
        hash: { type: string, description: 'Content hash of the version that runs' }
        status: { $ref: '#/components/schemas/RunStatus' }
        output: { description: 'The run output; on budget_exhausted and cancelled (and failed, when there is one) the partial result' }
        partial: { type: boolean, description: 'The run ended on a budget overrun: output is partial' }
        error: { type: [string, 'null'] }
        stop_reason: { type: [string, 'null'], description: 'Why a run stopped early (a budget), or a note on a run that succeeded (a loop that hit max_iterations)' }
        awaiting:
          type: [object, 'null']
          properties:
            step: { type: string }
            question: { type: [string, 'null'] }
        budget:
          type: object
          properties:
            steps_limit: { type: integer }
            steps_used: { type: integer }
            tokens_limit: { type: integer }
            tokens_used: { type: integer }
            wall_clock_ms_limit: { type: integer }
            wall_clock_ms_used: { type: integer, description: 'Execution time only (not waiting for a human or a timer)' }
            usd: { type: number, description: 'Model spend so far, priced like the metering' }
            usd_limit: { type: number, description: 'The run''s USD cap (absent: none; tenant caps still apply)' }
            depth_limit: { type: integer }
            depth_used: { type: integer, description: 'Deepest subnode nesting reached' }
            fanout_limit: { type: integer }
            fanout_used: { type: integer, description: 'Widest map reached' }
        cost_usd: { type: number, description: 'What the run spent on model calls so far (USD): the sum of `charged_usd` over its usage events' }
        usage: { $ref: '#/components/schemas/RunUsage' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RunStep' }
        claims: { type: integer, description: 'How many times a worker claimed the run (more than 1 after a takeover or a resume)' }
        origin: { type: string, description: 'What started the run when not a run request: `auto` (caliban/auto; the intent is not recorded with the run)' }
        input_labels: { type: array, items: { type: string }, description: 'Taint labels the run input carries from the start: `caller` when it holds untrusted caller data' }
        cancel_requested: { type: boolean, description: 'A cancellation was asked for and the run has not stopped yet' }
        last_event: { type: integer, description: 'Number of the run''s last event (resume its event stream after it)' }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    NodeSummary:
      type: object
      required: [tenant_id, name, versions, published, drafts, retired]
      properties:
        tenant_id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'], description: 'The latest version''s `description`' }
        kind: { type: [string, 'null'], enum: [workflow, agent, null] }
        live_version: { type: [integer, 'null'], description: 'The promoted version' }
        latest:
          type: object
          required: [version, state, hash]
          properties:
            version: { type: integer }
            state: { type: string, enum: [draft, published, retired] }
            hash: { type: string }
        versions: { type: integer, description: 'Versions not deleted' }
        published: { type: integer }
        drafts: { type: integer }
        retired: { type: integer }
        updated_at: { type: [string, 'null'], format: date-time, description: 'The last creation, publication, retirement or promotion' }
    RunStatus:
      type: string
      enum: [pending, running, sleeping, input_required, succeeded, failed, budget_exhausted, cancelled]
    RunUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      description: Tokens of the run's model calls so far
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
    RunStep:
      type: object
      required: [id, vertex, kind, status, tokens, usd, labels, started_at, duration_ms]
      properties:
        id: { type: string, description: 'Deterministic step id, e.g. classify#0, fanout#0/3, agent#2.1' }
        vertex: { type: string }
        kind: { type: string }
        status: { type: string, enum: [completed, failed] }
        tokens: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        usd: { type: number }
        labels: { type: array, items: { type: string }, description: 'Taint labels of the step''s output' }
        started_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        output: { description: 'Console only, with `runs.data`: the step''s output' }
    NodeRunSummary:
      type: object
      required: [id, object, node, version, status, cost_usd, invoker, created_at]
      properties:
        id: { type: string }
        object: { type: string, enum: [node.run] }
        node: { type: string }
        version: { type: integer }
        status: { $ref: '#/components/schemas/RunStatus' }
        awaiting_step: { type: [string, 'null'] }
        cost_usd: { type: number }
        origin: { type: string }
        invoker: { type: string, description: '`api_key:<hash prefix>`' }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    NodeRunList:
      type: object
      required: [object, data, next_cursor]
      properties:
        object: { type: string, enum: [list] }
        data: { type: array, items: { $ref: '#/components/schemas/NodeRunSummary' } }
        next_cursor: { type: [string, 'null'], description: 'Pass as `cursor` for the next page' }
    RunEvent:
      type: object
      required: [id, type, run_id, at, data]
      description: One event of a run's stream (the `data` of an SSE event).
      properties:
        id: { type: integer, description: 'Numbered from 1 per run; the SSE `id`' }
        type:
          type: string
          enum: [run.created, step.started, step.finished, run.input_required, run.sleeping, run.input_received, run.cancel_requested, run.finished]
        run_id: { type: string }
        at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
          description: 'By type: step events `step`, `vertex`, `kind`, `labels`, and on finish `status`, `tokens`, `prompt_tokens`, `completion_tokens`, `usd`, `cost_usd`, `duration_ms`; `run.input_required` `step`, `question`; `run.input_received` `step`, `by`; `run.finished` `status`, `error`, `stop_reason`, `cost_usd`.'
        run: { $ref: '#/components/schemas/NodeRun', description: 'On the last event of a stream' }
    ConsoleRun:
      type: object
      required: [id, object, node, version, status, steps, budget, content_visible, created_at]
      properties:
        id: { type: string }
        object: { type: string, enum: [node.run] }
        node: { type: string }
        version: { type: integer }
        hash: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        invoker: { type: string }
        origin: { type: [string, 'null'] }
        input_labels: { type: array, items: { type: string }, description: 'Taint labels the run input carries from the start (`caller`)' }
        error: { type: [string, 'null'] }
        stop_reason: { type: [string, 'null'] }
        partial: { type: boolean }
        awaiting:
          type: [object, 'null']
          properties:
            step: { type: string }
            kind: { type: string, enum: [question, approval] }
            question: { type: [string, 'null'], description: 'With `runs.data`' }
        cancel_requested: { type: boolean }
        cancelled_by: { type: [string, 'null'] }
        budget: { type: object, additionalProperties: true }
        cost_usd: { type: number }
        usage: { $ref: '#/components/schemas/RunUsage' }
        claims: { type: integer }
        last_event: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        content_visible: { type: boolean, description: 'The caller holds `runs.data`: `input`, `output` and step outputs are included' }
        input: { description: 'With `runs.data`' }
        output: { description: 'With `runs.data`' }
        steps: { type: array, items: { $ref: '#/components/schemas/RunStep' } }
    NodeCreate:
      type: object
      required: [tenant_id, name, spec]
      properties:
        tenant_id: { type: string }
        name: { type: string }
        spec: { type: object, additionalProperties: true }

    ToolAuth:
      type: object
      required: [method]
      description: How Caliban authenticates to the server. Client tokens are never passed through.
      properties:
        method: { type: string, enum: [caliban_token, api_key, oauth_client_credentials, none] }
        audience: { type: string, description: 'caliban_token: `aud` of minted tokens (default: the URL''s origin)' }
        header: { type: string, description: 'api_key: the header carrying the key (default `Authorization: Bearer`)' }
        token_url: { type: string, description: 'oauth_client_credentials' }
        client_id: { type: string, description: 'oauth_client_credentials' }
        scope: { type: string, description: 'oauth_client_credentials: requested scope (down-scoping)' }
    ToolServer:
      type: object
      required: [id, tenant_id, name, url, auth, trusted, created_at, created_by]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string, description: 'The `server` of `mcp://server/tool#sha256:...`' }
        url: { type: string }
        auth: { $ref: '#/components/schemas/ToolAuth' }
        trusted: { type: boolean, description: 'Trusted with personal data: PII surrogates in arguments are rehydrated for it' }
        has_credential: { type: boolean, description: 'A credential is stored (absent: none)' }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    ToolServerCreate:
      type: object
      required: [name, url]
      additionalProperties: false
      properties:
        name: { type: string }
        url: { type: string }
        auth: { $ref: '#/components/schemas/ToolAuth' }
        credential: { type: string, description: 'API key or OAuth client secret; sealed at once, never returned' }
        trusted: { type: boolean, default: false }
    ToolManifest:
      type: object
      required: [id, tenant_id, server, name, description, input_schema, pin, findings, status, discovered_at, approved_at, approved_by, findings_acknowledged]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        server: { type: string }
        name: { type: string }
        description: { type: string }
        input_schema: { type: object, additionalProperties: {}, description: 'The tool''s input JSON Schema, as the server lists it (any JSON object)' }
        pin: { type: string, description: 'sha256 over the canonical [name, description, input_schema]' }
        findings:
          type: array
          items:
            type: object
            required: [kind, location, excerpt]
            properties:
              kind: { type: string, enum: [instruction, hidden_unicode, url, exfiltration] }
              location: { type: string }
              excerpt: { type: string }
        status: { type: string, enum: [discovered, approved, revoked] }
        discovered_at: { type: string, format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
        approved_by: { type: [string, 'null'] }
        findings_acknowledged: { type: boolean }
        network: { type: [boolean, 'null'], description: 'The approver''s decision: the tool reaches the network through its arguments (null: none given)' }
        network_hint: { type: boolean, description: 'The input schema suggests it does (a URL, host or email argument, or x-caliban-network)' }

    UsageEvent:
      type: object
      required: [request_id, tenant_id, model, prompt_tokens, completion_tokens, cache, latency_ms, ts]
      properties:
        request_id: { type: string }
        tenant_id: { type: string }
        model: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cached_prompt_tokens: { type: integer, description: 'Part of prompt_tokens read from the provider prompt cache.' }
        cache_write_tokens: { type: integer, description: 'Part of prompt_tokens written to the provider prompt cache (Anthropic `cache_creation_input_tokens`). Omitted when 0.' }
        cache_write_1h_tokens: { type: integer, description: 'Part of cache_write_tokens written with the Anthropic 1-hour TTL. Omitted when 0.' }
        usage_source: { type: string, enum: [provider, estimated], description: '`provider`: the token counts are the provider''s usage report. `estimated`: no complete report arrived (the client disconnected mid-stream, the upstream stream failed or ended without usage, or the model has `rejects_stream_options`), so the gateway estimated them: prompt tokens from the provider''s partial report when one arrived (Anthropic `message_start`), else from the request; completion tokens from the output streamed so far, about 4 bytes per token. After a disconnect the provider may bill more than the estimate. Absent on cache hits (nothing consumed) and on events written before this field existed.' }
        tokens_saved: { type: integer, description: 'Tokens not sent upstream thanks to Caliban: on a cache hit of either tier, the cached answer''s prompt plus completion tokens' }
        intent: { type: string, description: 'Always empty in reports (routing decisions are content-class; see `by_route`). Set only in transit, from a data plane.' }
        cache: { type: string, enum: [hit, miss, bypass] }
        cache_tier: { type: string, enum: [exact, semantic], description: 'Only on hits: which cache tier answered.' }
        pii_entities: { type: integer }
        cost_usd: { type: [number, 'null'], description: 'Uncached prompt tokens at price_in_per_mtok, cache reads at price_cache_read_per_mtok, cache writes at price_cache_write_per_mtok (1-hour writes at price_cache_write_1h_per_mtok), completion at price_out_per_mtok. Unset cache prices fall back to the input price. Null when the model has no input or output price.' }
        latency_ms: { type: integer }
        ts: { type: string, format: date-time }
        requested_model: { type: string, description: 'Model the client asked for (`caliban/auto` or a pinned id). Chat requests only; absent otherwise.' }
        intent_confidence: { type: number, description: 'In transit only (never in reports): confidence of the intent decision, 0..1.' }
        route_stage: { type: string, enum: [rules, knn, keyword], description: 'In transit only (never in reports): the stage that decided the intent; counted in `by_route`.' }
        routed_model_cost_usd: { type: number, description: '`caliban/auto` only: real cost of the routed model for this request (the same number and cost function as `cost_usd`, prompt-cache prices included). Absent when the model has no price.' }
        flat_price_usd: { type: number, description: '`caliban/auto` only: flat auto price for the same tokens (`[routing] auto_price_*`), through the same cost function as `cost_usd`; the flat price has no cache prices, so cache reads and writes count at its input price. On a cache hit of either tier: the full flat price of the cached answer''s tokens (what a miss would have billed), recorded next to `billed_usd`. Events written before cache-hit billing record 0 on hits.' }
        billed_usd: { type: number, description: '`caliban/auto` only: what the customer is billed. `flat_price_usd` on a miss; on a cache hit of either tier, `flat_price_usd` x the tenant''s cache-hit fraction (`auto_cache_hit_fraction`, default 0.2). Margin = billed_usd - routed_model_cost_usd. Absent on events written before cache-hit billing (they billed `flat_price_usd`).' }
        saved_usd: { type: number, description: 'Cache hits only: what the hit saved the customer. `caliban/auto`: `flat_price_usd - billed_usd`. Other models: the model cost the hit avoided (the cached answer''s tokens at the input and output price; nothing reached the provider). Absent on misses and for unpriced models.' }
        node: { type: string, description: 'Node model calls only: the node of the run (its root node: a subnode''s calls are the run''s).' }
        node_version: { type: integer }
        run_id: { type: string }
        route: { type: string, description: 'In transit only (never in reports): the path a caliban/auto request took' }
        route_fallback: { type: string, description: 'In transit only (never in reports): why a model answered rather than a node; counted in `by_route`' }
    UsageReport:
      type: object
      required: [events, totals]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/UsageEvent' } }
        by_route:
          type: array
          description: 'Requests per tenant, UTC day, intent, deciding stage and fallback reason (empty strings: not set). The only routing record kept; not computed with `node` or `run_id`.'
          items:
            type: object
            required: [tenant_id, day, intent, route_stage, route_fallback, requests]
            properties:
              tenant_id: { type: string }
              day: { type: string, format: date }
              intent: { type: string }
              route_stage: { type: string }
              route_fallback: { type: string }
              requests: { type: integer }
        by_node:
          type: array
          description: The same totals per node version (node calls only), raw and rolled-up days.
          items:
            type: object
            properties:
              node: { type: string }
              node_version: { type: integer }
              totals: { $ref: '#/components/schemas/UsageTotals' }
        totals: { $ref: '#/components/schemas/UsageTotals' }
    UsageTotals:
      type: object
      properties:
        charged_usd: { type: number, description: 'What the customer is charged: the billed `caliban/auto` price (discounted on cache hits), the model''s cost otherwise. Over a run''s events it equals the run''s `cost_usd`.' }
        requests: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cached_prompt_tokens: { type: integer, description: 'Prompt tokens read from provider prompt caches' }
        cache_write_tokens: { type: integer, description: 'Prompt tokens written to provider prompt caches' }
        estimated_requests: { type: integer, description: 'Events with `usage_source: estimated`' }
        cache_hits: { type: integer, description: 'Hits of both tiers.' }
        saved_usd: { type: number, description: 'Sum of `saved_usd`: what cache hits saved customers, all models' }
        semantic_cache_hits: { type: integer }
        tokens_saved: { type: integer }
        cost_usd: { type: number }
        auto_requests: { type: integer, description: 'Requests that asked for `caliban/auto`' }
        auto_cache_hits: { type: integer, description: '`caliban/auto` requests answered by a cache tier (billed at the discounted price)' }
        flat_price_usd: { type: number, description: 'Full flat price, summed over `caliban/auto` events that carry both prices (cache hits at their full price)' }
        billed_usd: { type: number, description: 'What those events were billed: the flat price on misses, the discounted price on cache hits' }
        auto_saved_usd: { type: number, description: 'What `caliban/auto` cache hits saved customers: flat_price_usd - billed_usd over hits' }
        routed_model_cost_usd: { type: number, description: 'Sum over the same events (0 on cache hits)' }
        margin_usd: { type: number, description: 'billed_usd - routed_model_cost_usd' }

    Route:
      type: object
      required: [intent, models]
      properties:
        intent: { type: string }
        models: { type: array, items: { type: string }, description: 'Ordered: first is preferred, the rest are fallbacks' }
    RoutesPut:
      type: object
      required: [routes]
      properties:
        routes: { type: array, items: { $ref: '#/components/schemas/Route' } }

    AuditEntry:
      type: object
      required: [seq, ts, actor, action, detail, hash]
      properties:
        seq: { type: integer }
        ts: { type: string, format: date-time }
        tenant_id: { type: [string, 'null'] }
        actor: { type: string, description: 'The user as `email <issuer#subject>`, `break_glass` (bootstrap token), `system`, or `anonymous` (failed logins)' }
        action: { type: string, description: 'e.g. tenant.create, api_key.create, provider_key.delete, routes.set, store.seed, auth.login, auth.logout, auth.login_failed, auth.break_glass, role_binding.create' }
        target: { type: [string, 'null'] }
        detail: { type: object, additionalProperties: true }
        prev_hash: { type: [string, 'null'], description: 'Hex; null for the first row' }
        hash: { type: string, description: 'Hex sha256' }
    AuditLog:
      type: object
      required: [entries, chain_verified]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        head:
          type: [object, 'null']
          properties:
            seq: { type: integer }
            hash: { type: string }
        chain_verified: { type: boolean }

    Role:
      type: string
      enum: [owner, admin, auditor, tenant_admin, developer, viewer, billing]
    Permission:
      type: string
      enum: [tenants.create, catalog.read, catalog.write, providers.probe, audit.read, rbac.read, rbac.write,
             tenant.read, tenant.write, tenant.delete, api_keys.read, api_keys.write, provider_keys.read,
             provider_keys.write, routes.read, routes.write, datasources.read, datasources.write, ontology.read,
             ontology.review, nodes.read, nodes.write, nodes.publish, nodes.run, tools.read, tools.write,
             tools.approve, runs.read, runs.data, runs.answer, usage.read]
    RoleInfo:
      type: object
      required: [role, scope, description, permissions]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        scope: { type: string, enum: [deployment, tenant] }
        description: { type: string }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    User:
      type: object
      required: [id, issuer, subject, created_at]
      properties:
        id: { type: string }
        issuer: { type: string }
        subject: { type: string }
        email: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        role_bindings: { type: array, items: { $ref: '#/components/schemas/RoleBinding' }, description: 'Bindings naming this user (GET /users only)' }
        active_sessions: { type: integer, description: 'GET /users only' }
    RoleBinding:
      type: object
      required: [id, subject_kind, subject, role, created_at, created_by]
      properties:
        id: { type: string }
        subject_kind: { type: string, enum: [user, group] }
        subject: { type: string, description: 'A user id, or a group name as the identity provider sends it' }
        role: { $ref: '#/components/schemas/Role' }
        tenant_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    RoleBindingCreate:
      type: object
      required: [subject_kind, subject, role]
      additionalProperties: false
      properties:
        subject_kind: { type: string, enum: [user, group] }
        subject: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        tenant_id: { type: [string, 'null'] }
    GroupMapping:
      type: object
      required: [group, role, source]
      properties:
        group: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        tenant_id: { type: [string, 'null'] }
        source: { type: string, enum: [config] }
    RoleBindingList:
      type: object
      required: [bindings, group_mappings]
      properties:
        bindings: { type: array, items: { $ref: '#/components/schemas/RoleBinding' } }
        group_mappings: { type: array, items: { $ref: '#/components/schemas/GroupMapping' } }
        groups_claim: { type: [string, 'null'] }
    AuthConfig:
      type: object
      required: [sso_enabled, break_glass_enabled]
      properties:
        sso_enabled: { type: boolean }
        break_glass_enabled: { type: boolean }
        login_url: { type: [string, 'null'] }
    Me:
      type: object
      required: [authenticated, method, actor, roles, permissions]
      properties:
        authenticated: { type: boolean }
        method: { type: string, enum: [session, bearer, break_glass] }
        actor: { type: string }
        user: { oneOf: [ { $ref: '#/components/schemas/User' }, { type: 'null' } ] }
        groups: { type: array, items: { type: string } }
        roles:
          type: array
          items:
            type: object
            required: [role]
            properties:
              role: { $ref: '#/components/schemas/Role' }
              tenant_id: { type: string }
        permissions:
          type: object
          required: [deployment, tenants]
          properties:
            deployment:
              type: array
              description: Held deployment-wide; tenant-scoped ones here apply to every tenant.
              items: { $ref: '#/components/schemas/Permission' }
            tenants:
              type: object
              additionalProperties: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        csrf_token: { type: string, description: 'Sessions only: send as X-CSRF-Token on writes' }
        session:
          type: object
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }

    SignedSnapshot:
      type: object
      required: [key_id, payload, signature]
      properties:
        key_id: { type: string, description: 'First 16 hex chars of sha256(public key)' }
        payload:
          type: string
          description: |
            base64 of JSON {version, issued_at_ms, config, kek_ids}; config has the caliban.toml structure. kek_ids
            (omitted when empty) lists the KEKs (`kek_` fingerprints) that sealed the secrets in config: what a router
            needs in its keyring to open them.
        signature: { type: string, description: 'base64 Ed25519 signature' }
