# Caliban configuration (standalone / on-prem example)
# Loaded from $CALIBAN_CONFIG. Secrets are never written inline: use { env = "..." } or { file = "..." }.
# In connected mode, the control plane renders this same structure as a signed snapshot.

[server]
router_addr = "0.0.0.0:8080"
control_plane_addr = "0.0.0.0:8081"
# Static web console files (built from the web/ repo). Optional.
web_dir = "/usr/share/caliban/web"

[security]
# deny_by_default: the data plane only calls base_urls declared under tenants.providers.
egress = "deny_by_default"
# Admin bearer token for the control plane API.
admin_token = { env = "CALIBAN_ADMIN_TOKEN" }

[cache]
exact_enabled = true
exact_max_entries = 100000
exact_ttl_secs = 3600

# T2 semantic cache: reuses the answer to an earlier, semantically similar request of the SAME
# tenant (same model, system prompt, history and parameters; only the last user message may
# differ). Off unless enabled here AND `semantic_cache = "on"` on the tenant. Store: Qdrant over
# REST (port 6333; CALIBAN_QDRANT_URL wins over qdrant_url), or "memory" for one process.
# Thresholds start conservative and are learned per entry from verification (see the README).
# Needs an embedding model in [[models]] (kind = "embedding"), e.g. Qwen3-Embedding-0.6B on TEI;
# see open-models.example.toml for a working setup.
# [cache.semantic]
# enabled = false
# store = "qdrant"
# qdrant_url = "http://qdrant:6333"
# qdrant_api_key = { env = "CALIBAN_QDRANT_API_KEY" }
# collection_prefix = "caliban_semcache"
# embedding_model = "local/qwen3-embedding-0.6b"  # the same model as [routing] embedding_model
#                                  # lets one embedding per request serve both
# threshold = 0.95                 # starting per-entry cosine threshold
# min_threshold = 0.90             # learned thresholds never go below
# grey_band = 0.03                 # just below the threshold: answer fresh, verify, learn
# max_error_rate = 0.02            # error budget: tighten a tenant's thresholds above this
# verify_rate = 0.05               # share of would-be hits answered fresh to measure errors
# verify_answer_similarity = 0.90  # answers this close (cosine) count as the same answer
# max_temperature = 0.3            # hotter (or unset) requests are not cached unless they opt in
# ttl_secs = 86400
# lookup_budget_ms = 50            # embed + search; slower means a miss
# embed_timeout_ms = 2000

[pii]
# Default for tenants that don't override it: off | mask | reversible
default_mode = "reversible"

# Rate limits and token budgets (all optional; unset = unlimited). 429 + retry-after when exceeded.
# [limits]
# store = "memory"                 # "memory" (per router process) or "valkey" (shared by all
#                                  # routers; needs CALIBAN_VALKEY_URL, falls back to local limits
#                                  # while Valkey is unreachable). Read at start-up.
# valkey_key_prefix = "caliban"    # key namespace, so deployments can share one Valkey
# valkey_timeout_ms = 30           # max wait per quota call before limiting locally (1-1000)
# requests_per_minute = 600        # GCRA, per tenant
# key_requests_per_minute = 120    # GCRA, per API key
# tokens_per_minute = 400000       # reserved: prompt estimate + max_tokens, settled to actual usage
# tokens_per_day = 20000000        # per UTC day
# usd_per_day = 50.0               # per UTC day (needs model prices)
# [limits.tenants.acme]            # per-tenant overrides
# requests_per_minute = 1200

# caliban/auto routing (all optional). Without [routing], intents come from keyword rules and each
# tenant's route order is kept. Stage-1 kNN needs an embedding model on a shared [[providers]] entry.
# [routing]
# embedding_model = "local/bge-small"       # catalogue model with kind = "embedding"
# embedder_artifact = "bge-small@1.0.0"     # ml embedder artifact; a calibration must require the same
# budget_ms = 25                            # embed + kNN; over budget = keyword rules
# calibration_dir = "/opt/caliban/artifacts/intent_head/knn-default/1.0.0"
# profile_dir = "/opt/caliban/artifacts/router_profile/core/1.0.0"
# exemplar_cache_dir = "/var/lib/caliban/knn"
# auto_price_in_per_mtok = 3.0              # flat caliban/auto price, metered next to the real cost
# auto_price_out_per_mtok = 12.0
# [routing.floors]                          # quality floor per intent (0..1); "*" covers the rest
# code = 0.8
# [routing.quality."openai/gpt-5-mini"]     # per-model quality per intent (overrides the profile)
# code = 0.86
# [routing.tenants.acme]
# floors = { code = 0.9 }
# exemplars = { "legal.review" = ["review this NDA clause for risky terms"] }

# ─────────────── Model catalogue ───────────────
# `provider` names a provider id that each tenant must define (BYOK). A tenant only sees
# models whose provider it has configured.
[[models]]
id = "local/gpt-oss-20b"
provider = "local-llm"
upstream_model = "openai/gpt-oss-20b"
trust_tier = "t0_sovereign"
licence = "apache-2.0"
context_window = 131072
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0

[[models]]
id = "local/qwen3-8b"
provider = "local-llm"
upstream_model = "Qwen/Qwen3-8B"
trust_tier = "t0_sovereign"
licence = "apache-2.0"
context_window = 32768
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0

[[models]]
id = "openai/gpt-5-mini"
provider = "openai"
upstream_model = "gpt-5-mini"
trust_tier = "t2_contracted"
licence = "proprietary"

# ─────────────── Tenants ───────────────
[[tenants]]
id = "acme"
name = "Acme Corp"
pii_mode = "reversible"
# Surrogate consistency in reversible mode. "tenant" (default): the same value always gets the
# same surrogate in this tenant (keyed HMAC, per-tenant key derived from CALIBAN_KEK), so
# pseudonymised requests can hit the exact cache; sessions of the tenant become linkable through
# their surrogates. "session": fresh surrogates per request (unlinkable, PII requests bypass the
# cache). Surrogates never cross tenants.
# pii_surrogate_scope = "tenant"
# T2 semantic cache for this tenant: "off" (default) or "on" (also needs [cache.semantic] enabled).
# semantic_cache = "off"
# SHA-256 hex of each API key. Generate a key with `caliban keygen`.
api_key_hashes = [
  # "3f5c…",
]

  # Local, on-prem model server (vLLM, SGLang, llama.cpp, Ollama, …). No key needed.
  [[tenants.providers]]
  id = "local-llm"
  kind = "openai_compatible"
  base_url = "http://llm:8000/v1"
  trust_tier = "t0_sovereign"

  # Customer-supplied key (BYOK). Remove this block for fully air-gapped deployments.
  [[tenants.providers]]
  id = "openai"
  kind = "openai"
  base_url = "https://api.openai.com/v1"
  trust_tier = "t2_contracted"
  api_key = { env = "ACME_OPENAI_API_KEY" }

  # Intent → ordered candidate models (first = preferred, rest = fallbacks).
  [[tenants.routes]]
  intent = "default"
  models = ["local/gpt-oss-20b", "openai/gpt-5-mini"]

  [[tenants.routes]]
  intent = "chat"
  models = ["local/qwen3-8b", "local/gpt-oss-20b"]

  [[tenants.routes]]
  intent = "code"
  models = ["local/gpt-oss-20b"]
