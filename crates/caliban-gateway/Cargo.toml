[package]
name = "caliban-gateway"
description = "Data plane: OpenAI- and Anthropic-compatible HTTP API, the request pipeline, quotas and OTel GenAI tracing."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
caliban-types.workspace = true
caliban-config.workspace = true
caliban-ir.workspace = true
caliban-pii.workspace = true
caliban-cache.workspace = true
caliban-route.workspace = true
caliban-providers.workspace = true
caliban-meter.workspace = true
async-trait.workspace = true
axum.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
moka.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# OpenTelemetry GenAI tracing; OTLP over HTTP/protobuf (prost code is pre-generated: no protoc).
# Only active when OTEL_EXPORTER_OTLP_ENDPOINT is set.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", default-features = false }

[dev-dependencies]
reqwest.workspace = true
tower.workspace = true
uuid.workspace = true

[lints]
workspace = true
