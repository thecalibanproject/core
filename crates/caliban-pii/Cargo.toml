[package]
name = "caliban-pii"
description = "PII detection (L0 patterns + tenant dictionaries, L1 NER via ONNX), reversible surrogates, streaming rehydration."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# L1 NER detector (ONNX Runtime + HF tokenizers). Off by default so the workspace builds without
# ONNX Runtime. `ort/download-binaries` fetches a prebuilt ONNX Runtime at *build* time only; for
# air-gapped builds set ORT_LIB_LOCATION (see MODELS.md). Nothing is downloaded at runtime.
ner = ["dep:ort", "dep:tokenizers"]

[dependencies]
caliban-types.workspace = true
caliban-ir.workspace = true
aho-corasick.workspace = true
hmac.workspace = true
regex.workspace = true
sha2.workspace = true
thiserror.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-24"] }
tokenizers = { version = "0.23.2", optional = true, default-features = false, features = ["onig"] }

[lints]
workspace = true

[[example]]
name = "ner_bench"
required-features = ["ner"]
